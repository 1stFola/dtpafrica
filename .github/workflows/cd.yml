name: CD — Deploy to Staging

# ── Triggers ──────────────────────────────────────────────────────────────────
# Automatic: fires on every push to dev or main
# Manual:    GitHub Actions UI → "Run workflow"
on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already exists)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_deploy:
        description: "Skip Ansible deploy (infra check only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# ── Concurrency: cancel any in-progress deploy on the same branch ─────────────
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── Job 1: Terraform — provision AWS infrastructure ────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    outputs:
      server_public_ip: ${{ steps.tf_out.outputs.server_public_ip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform 1.8.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false   # must be false to capture raw outputs

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.skip_terraform != 'true' }}
        run: terraform apply -auto-approve tfplan

      - name: Capture outputs
        id: tf_out
        run: |
          echo "server_public_ip=$(terraform output -raw server_public_ip)" >> "$GITHUB_OUTPUT"

      - name: Print access details
        run: |
          echo "============================================"
          echo "  App URL : $(terraform output -raw app_url)"
          echo "  Health  : $(terraform output -raw health_check_url)"
          echo "  SSH     : $(terraform output -raw ssh_command)"
          echo "============================================"

  # ── Job 2: Ansible — configure server and deploy app ──────────────────────
  deploy:
    name: Ansible deploy
    needs: terraform
    if: ${{ github.event.inputs.skip_deploy != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Needed so Ansible can call Secrets Manager from inside the runner
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Install Ansible + Python AWS libraries
        run: |
          pip install --quiet \
            ansible==10.* \
            boto3 \
            botocore

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/dtp-staging.pem
          chmod 600 ~/.ssh/dtp-staging.pem
          # Verify key is readable (does not print content)
          ssh-keygen -l -f ~/.ssh/dtp-staging.pem

      - name: Write Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [server]
          ${{ needs.terraform.outputs.server_public_ip }} \
            ansible_user=ubuntu \
            ansible_ssh_private_key_file=~/.ssh/dtp-staging.pem \
            ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

          [all:vars]
          server_public_ip=${{ needs.terraform.outputs.server_public_ip }}
          EOF

      - name: Wait for SSH (up to 3 minutes)
        run: |
          echo "Waiting for SSH on ${{ needs.terraform.outputs.server_public_ip }}..."
          timeout 180 bash -c '
            until ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i ~/.ssh/dtp-staging.pem \
              ubuntu@${{ needs.terraform.outputs.server_public_ip }} \
              "echo SSH_READY" 2>/dev/null | grep -q SSH_READY
            do
              echo "  not ready yet — retrying in 10s"
              sleep 10
            done
          '
          echo "SSH is up"

      - name: Run Ansible playbook
        run: |
          ansible-playbook playbook.yml \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "secrets_manager_db_secret_name=dtp/staging/db" \
            -e "secrets_manager_app_secret_name=dtp/staging/app" \
            -e "git_repo_url=${{ secrets.GIT_REPO_URL }}" \
            -e "git_branch=main"
        env:
          # Ansible uses these env vars to call AWS APIs directly
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"

      - name: Verify deployment (external health check)
        run: |
          echo "Running external health check..."
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "http://${{ needs.terraform.outputs.server_public_ip }}/api/v1/health" \
            || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Health check passed (HTTP $HTTP)"
          else
            echo "Health check failed — got HTTP $HTTP"
            exit 1
          fi

      - name: Deployment summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║         Deployment complete                  ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  App   : http://${{ needs.terraform.outputs.server_public_ip }}"
          echo "║  Health: http://${{ needs.terraform.outputs.server_public_ip }}/api/v1/health"
          echo "╚══════════════════════════════════════════════╝"
