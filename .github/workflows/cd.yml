name: CD — Deploy to Staging

# Deliberately NOT `on: push`. A push-triggered deploy shipped whatever landed on main
# whether or not it passed: CI and CD started together and CD had no dependency on the
# result, so a merge with a red tick still reached the staging box -- and that box serves
# the live site.
#
# `workflow_run` inverts it. This runs only after the CI workflow has *finished*, and the
# job below refuses anything but a success. The commit deployed is the commit CI verified,
# `workflow_run.head_sha`, rather than whatever the branch tip happens to be by then.
#
# Two consequences worth knowing:
#  * GitHub only ever runs the copy of this file that is on the default branch, so changes
#    here do nothing until they are merged, and a pull request cannot exercise them.
#  * A failing test now blocks a deploy. That is the point, and it means a flaky test
#    blocks one too -- fix or quarantine the test, never remove the gate.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  # The escape hatch, unchanged: a human can still deploy deliberately.
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already exists)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_deploy:
        description: "Skip Ansible deploy (infra check only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write

