name: CD — Deploy to Staging

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already exists)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_deploy:
        description: "Skip Ansible deploy (infra check only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Job 1: Terraform ──────────────────────────────────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    outputs:
      server_public_ip: ${{ steps.tf_out.outputs.server_public_ip }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform 1.8.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Restore Terraform state from state branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git fetch origin terraform-state 2>/dev/null; then
            git show origin/terraform-state:terraform.tfstate > terraform.tfstate 2>/dev/null \
              && echo "State restored" \
              || echo "No state file on branch yet"
          else
            echo "No state branch — first run"
          fi

      - name: Terraform init
        run: terraform init

      - name: Reconcile state with real AWS resources
        run: |
          if [ ! -f terraform.tfstate ]; then
            echo "No state — skipping reconcile"
            exit 0
          fi

          INSTANCE_ID=$(terraform state show aws_instance.server 2>/dev/null \
            | grep '^\s*id\s*=' | head -1 | awk -F'"' '{print $2}' || echo "")

          if [ -z "$INSTANCE_ID" ]; then
            echo "No instance in state"
            exit 0
          fi

          echo "Instance in state: $INSTANCE_ID"

          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || echo "not-found")

          echo "AWS instance state: $INSTANCE_STATE"

          if [ "$INSTANCE_STATE" = "terminated" ] || [ "$INSTANCE_STATE" = "not-found" ] || [ "$INSTANCE_STATE" = "None" ]; then
            echo "Instance gone — clearing stale state so Terraform rebuilds"
            terraform state rm aws_eip.server                     || true
            terraform state rm aws_instance.server                || true
            VPC_ID=$(terraform state show aws_vpc.main 2>/dev/null \
              | grep '^\s*id\s*=' | head -1 | awk -F'"' '{print $2}' || echo "")
            if [ -n "$VPC_ID" ]; then
              VPC_EXISTS=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" \
                --query 'Vpcs[0].VpcId' --output text 2>/dev/null || echo "not-found")
              if [ "$VPC_EXISTS" = "not-found" ] || [ -z "$VPC_EXISTS" ] || [ "$VPC_EXISTS" = "None" ]; then
                echo "VPC also gone — clearing all network state"
                terraform state rm aws_route_table_association.public || true
                terraform state rm aws_route_table.public             || true
                terraform state rm aws_internet_gateway.main          || true
                terraform state rm aws_subnet.public                  || true
                terraform state rm aws_security_group.server          || true
                terraform state rm aws_vpc.main                       || true
              fi
            fi
          else
            echo "Instance is $INSTANCE_STATE — reusing existing infrastructure"
          fi

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform apply
        if: github.event.inputs.skip_terraform != 'true'
        run: terraform apply -auto-approve tfplan

      # Capture outputs BEFORE switching branches for state commit
      - name: Capture Terraform outputs
        id: tf_out
        run: |
          IP=$(terraform output -raw server_public_ip)
          echo "server_public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Captured IP: $IP"

      - name: Print access details
        run: |
          echo "  App URL : $(terraform output -raw app_url)"
          echo "  Health  : $(terraform output -raw health_check_url)"
          echo "  SSH     : $(terraform output -raw ssh_command)"

      # Save state AFTER capturing outputs so branch switch doesn't affect outputs
      - name: Commit Terraform state to state branch
        if: always()
        run: |
          STATE_FILE="${{ github.workspace }}/infra/terraform/terraform.tfstate"
          if [ ! -f "$STATE_FILE" ]; then
            echo "No state file — skipping"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git fetch origin terraform-state 2>/dev/null || true

          if git ls-remote --exit-code origin terraform-state >/dev/null 2>&1; then
            git checkout terraform-state
          else
            git checkout --orphan terraform-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # The state file is already in place — just stage and commit it
          git add --force terraform.tfstate
          git diff --cached --quiet && echo "State unchanged" && exit 0
          git commit -m "chore: update terraform state [run ${{ github.run_id }}]"
          git push origin terraform-state
          echo "State saved to terraform-state branch"

  # ── Job 2: Ansible ────────────────────────────────────────────────────────
  deploy:
    name: Ansible deploy
    needs: terraform
    if: github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Always resolve the IP fresh from AWS — never trust a stale value
      - name: Resolve server IP from AWS
        id: resolve_ip
        run: |
          # Try the terraform job output first
          IP="${{ needs.terraform.outputs.server_public_ip }}"

          # If empty or looks wrong, query AWS directly for the EIP
          if [ -z "$IP" ] || [ "$IP" = "" ]; then
            echo "Job output empty — querying AWS for Elastic IP"
            IP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=dtp-staging-eip" \
              --query 'Addresses[0].PublicIp' \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Could not resolve server IP — aborting"
            exit 1
          fi

          echo "Server IP: $IP"
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install Ansible + Python AWS libraries
        run: |
          pip install --quiet \
            "ansible-core==2.16.*" \
            boto3 botocore awscli

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/dtp-staging.pem
          chmod 600 ~/.ssh/dtp-staging.pem
          ssh-keygen -l -f ~/.ssh/dtp-staging.pem

      - name: Write Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [server]
          ${{ steps.resolve_ip.outputs.server_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/dtp-staging.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

          [all:vars]
          server_public_ip=${{ steps.resolve_ip.outputs.server_ip }}
          EOF
          cat inventory.ini

      - name: Wait for SSH (up to 3 minutes)
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          timeout 180 bash -c "
            until ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i ~/.ssh/dtp-staging.pem \
              ubuntu@$IP \
              'echo SSH_READY' 2>/dev/null | grep -q SSH_READY
            do
              echo '  not ready yet - retrying in 10s'
              sleep 10
            done
          "
          echo "SSH is up on $IP"

      - name: Wait for cloud-init to complete
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/dtp-staging.pem ubuntu@$IP \
            "cloud-init status --wait || true"
          echo "cloud-init done"

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/db \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          APP_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/app \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          echo "POSTGRES_USER=$(echo $DB_SECRET  | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_USER"])')"  >> "$GITHUB_OUTPUT"
          echo "POSTGRES_DB=$(echo $DB_SECRET    | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_DB"])')"    >> "$GITHUB_OUTPUT"
          echo "ADMIN_API_KEY=$(echo $APP_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["ADMIN_API_KEY"])')"  >> "$GITHUB_OUTPUT"

          POSTGRES_PASSWORD=$(echo $DB_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_PASSWORD"])')
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Run Ansible playbook
        run: |
          ansible-playbook playbook.yml \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=${{ secrets.GIT_REPO_URL }}" \
            -e "git_branch=main" \
            -e "postgres_user=${{ steps.secrets.outputs.POSTGRES_USER }}" \
            -e "postgres_password=${{ steps.secrets.outputs.POSTGRES_PASSWORD }}" \
            -e "postgres_db=${{ steps.secrets.outputs.POSTGRES_DB }}" \
            -e "admin_api_key=${{ steps.secrets.outputs.ADMIN_API_KEY }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"

      - name: Verify deployment
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
            "http://$IP/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Health check passed (HTTP $HTTP)"
          else
            echo "Health check failed — got HTTP $HTTP"
            exit 1
          fi

      - name: Deployment summary
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "========================================"
          echo "  Deployment complete"
          echo "  App:    http://$IP"
          echo "  Health: http://$IP/api/v1/health"
          echo "========================================"
