name: CD — Deploy to Staging

# ── Triggers ──────────────────────────────────────────────────────────────────
# Automatic deployment is DISABLED for push events.
# Deploy only runs when manually triggered from the GitHub Actions UI.
# To deploy: Actions → CD — Deploy to Staging → Run workflow
on:
  workflow_dispatch:
    inputs:
      skip_terraform:
        description: "Skip Terraform (infra already exists)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_deploy:
        description: "Skip Ansible deploy (infra check only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ── Job 1: Terraform ──────────────────────────────────────────────────────
  terraform:
    name: Terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infra/terraform

    outputs:
      server_public_ip: ${{ steps.tf_out.outputs.server_public_ip }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Setup Terraform 1.8.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Restore Terraform state from state branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          if git fetch origin terraform-state 2>/dev/null; then
            git show origin/terraform-state:terraform.tfstate > terraform.tfstate 2>/dev/null \
              && echo "State restored — Terraform will update existing infrastructure" \
              || echo "No state file on branch yet"
          else
            echo "No state branch — first run"
          fi

      - name: Terraform init
        run: terraform init

      - name: Reconcile state with real AWS resources
        run: |
          echo "=== Current state resources ==="
          terraform state list 2>/dev/null || echo "No state yet"

          # Check if the tagged EIP exists in AWS
          EIP_ALLOC=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=dtp-staging-eip" \
            --query 'Addresses[0].AllocationId' \
            --output text 2>/dev/null || echo "")

          EIP_IP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=dtp-staging-eip" \
            --query 'Addresses[0].PublicIp' \
            --output text 2>/dev/null || echo "")

          echo "EIP in AWS: $EIP_IP ($EIP_ALLOC)"

          # If EIP exists in AWS but not in state, import it
          if [ -n "$EIP_ALLOC" ] && [ "$EIP_ALLOC" != "None" ]; then
            IN_STATE=$(terraform state show aws_eip.server 2>/dev/null | grep "id" | head -1 || echo "")
            if [ -z "$IN_STATE" ]; then
              echo "EIP exists in AWS but not in state — importing..."
              terraform import aws_eip.server "$EIP_ALLOC" || true
            fi
          fi

          # Check if the tagged EC2 instance exists
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=dtp-staging-server" "Name=instance-state-name,Values=running,stopped,pending" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "")

          echo "EC2 in AWS: $INSTANCE_ID"

          if [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ]; then
            IN_STATE=$(terraform state show aws_instance.server 2>/dev/null | grep "^id" | head -1 || echo "")
            if [ -z "$IN_STATE" ]; then
              echo "EC2 exists in AWS but not in state — importing..."
              terraform import aws_instance.server "$INSTANCE_ID" || true
            fi
          fi

          echo "=== State after reconcile ==="
          terraform state list 2>/dev/null || echo "No state"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var="key_pair_name=${{ secrets.EC2_KEY_PAIR_NAME }}" \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Show what Terraform will change
        run: |
          echo "=== Resources Terraform will create/update ==="
          terraform show -json tfplan | python3 -c "
          import sys, json
          plan = json.load(sys.stdin)
          changes = [r for r in plan.get('resource_changes', [])
                     if r.get('change', {}).get('actions', ['no-op']) != ['no-op']]
          if not changes:
              print('No changes — infrastructure is up to date')
          else:
              for r in changes:
                  print(f\"  {r['change']['actions']} {r['address']}\")
          " 2>/dev/null || true

      - name: Terraform apply
        if: github.event.inputs.skip_terraform != 'true'
        run: terraform apply -auto-approve tfplan

      # Capture outputs BEFORE switching branches for state commit
      - name: Capture Terraform outputs
        id: tf_out
        run: |
          IP=$(terraform output -raw server_public_ip)
          echo "server_public_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Captured IP: $IP"

      - name: Print access details
        run: |
          echo "  EC2 IP  : $(terraform output -raw server_public_ip)"
          echo "  App URL : $(terraform output -raw app_url)"
          echo "  Health  : $(terraform output -raw health_check_url)"
          echo "  CDN URL : $(terraform output -raw cloudfront_domain 2>/dev/null || echo 'not yet provisioned')"
          echo "  SSH     : $(terraform output -raw ssh_command)"

      # Save state AFTER capturing outputs
      - name: Commit Terraform state to state branch
        if: always()
        run: |
          STATE_FILE="${{ github.workspace }}/infra/terraform/terraform.tfstate"
          if [ ! -f "$STATE_FILE" ]; then
            echo "No state file — skipping"
            exit 0
          fi

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          git fetch origin terraform-state 2>/dev/null || true

          if git ls-remote --exit-code origin terraform-state >/dev/null 2>&1; then
            git checkout terraform-state
          else
            git checkout --orphan terraform-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          git add --force terraform.tfstate
          git diff --cached --quiet && echo "State unchanged" && exit 0
          git commit -m "chore: update terraform state [run ${{ github.run_id }}]"
          git push origin terraform-state
          echo "State saved to terraform-state branch"

  # ── Job 2: Ansible ────────────────────────────────────────────────────────
  deploy:
    name: Ansible deploy
    needs: terraform
    if: github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Always resolve the IP fresh from AWS — never trust a stale value
      - name: Resolve server IP from AWS
        id: resolve_ip
        run: |
          IP="${{ needs.terraform.outputs.server_public_ip }}"

          if [ -z "$IP" ] || [ "$IP" = "" ]; then
            echo "Job output empty — querying AWS for Elastic IP"
            IP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=dtp-staging-eip" \
              --query 'Addresses[0].PublicIp' \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Could not resolve server IP — aborting"
            exit 1
          fi

          echo "Server IP: $IP"
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install Ansible + Python AWS libraries
        run: |
          pip install --quiet \
            "ansible-core==2.16.*" \
            boto3 botocore awscli

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/dtp-staging.pem
          chmod 600 ~/.ssh/dtp-staging.pem
          ssh-keygen -l -f ~/.ssh/dtp-staging.pem

      - name: Write Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [server]
          ${{ steps.resolve_ip.outputs.server_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/dtp-staging.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

          [all:vars]
          server_public_ip=${{ steps.resolve_ip.outputs.server_ip }}
          EOF
          cat inventory.ini

      - name: Wait for SSH (up to 3 minutes)
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          timeout 180 bash -c "
            until ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i ~/.ssh/dtp-staging.pem \
              ubuntu@$IP \
              'echo SSH_READY' 2>/dev/null | grep -q SSH_READY
            do
              echo '  not ready yet - retrying in 10s'
              sleep 10
            done
          "
          echo "SSH is up on $IP"

      - name: Wait for cloud-init to complete
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/dtp-staging.pem ubuntu@$IP \
            "cloud-init status --wait || true"
          echo "cloud-init done"

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/db \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          APP_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/app \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          echo "POSTGRES_USER=$(echo $DB_SECRET  | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_USER"])')"  >> "$GITHUB_OUTPUT"
          echo "POSTGRES_DB=$(echo $DB_SECRET    | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_DB"])')"    >> "$GITHUB_OUTPUT"
          echo "ADMIN_API_KEY=$(echo $APP_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["ADMIN_API_KEY"])')"  >> "$GITHUB_OUTPUT"

          POSTGRES_PASSWORD=$(echo $DB_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_PASSWORD"])')
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Run Ansible playbook
        run: |
          ansible-playbook playbook.yml \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=${{ secrets.GIT_REPO_URL }}" \
            -e "git_branch=${{ github.ref_name }}" \
            -e "git_repo_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "postgres_user=${{ steps.secrets.outputs.POSTGRES_USER }}" \
            -e "postgres_password=${{ steps.secrets.outputs.POSTGRES_PASSWORD }}" \
            -e "postgres_db=${{ steps.secrets.outputs.POSTGRES_DB }}" \
            -e "admin_api_key=${{ steps.secrets.outputs.ADMIN_API_KEY }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"

      - name: Verify deployment
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
            "http://$IP/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Health check passed (HTTP $HTTP)"
          else
            echo "Health check failed — got HTTP $HTTP"
            exit 1
          fi

      - name: Invalidate CloudFront cache
        run: |
          CF_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='dtp-staging'].Id" \
            --output text 2>/dev/null || echo "")

          if [ -n "$CF_ID" ] && [ "$CF_ID" != "None" ]; then
            echo "Invalidating CloudFront distribution: $CF_ID"
            aws cloudfront create-invalidation \
              --distribution-id "$CF_ID" \
              --paths "/*"
            echo "Cache invalidation submitted"
          else
            echo "No CloudFront distribution found — skipping invalidation"
          fi

      - name: Deployment summary
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          CF=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='dtp-staging'].DomainName" \
            --output text 2>/dev/null || echo "")
          echo "========================================"
          echo "  Deployment complete"
          echo "  EC2:    http://$IP"
          echo "  CDN:    https://$CF"
          echo "  Health: http://$IP/api/v1/health"
          echo "========================================"
