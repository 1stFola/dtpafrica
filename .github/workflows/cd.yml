  # # ── Job 2: Ansible ────────────────────────────────────────────────────────
  deploy:
    name: Ansible deploy
    # needs: terraform
    # A manual run deploys on the operator's judgement; an automatic one deploys only a
    # commit whose CI run concluded `success`. Testing `conclusion` rather than the event
    # covers cancelled and timed-out runs too, neither of which is a pass.
    if: >-
      github.event.inputs.skip_deploy != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    env:
      # The commit CI verified. Under `workflow_run`, GITHUB_SHA points at the default
      # branch rather than at the run being reacted to, so it is not safe to build from:
      # deploying a different commit than the one that passed is the bug being fixed here.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    steps:
      - name: Say what authorised this deploy
        run: |
          echo "Trigger:  ${{ github.event_name }}"
          echo "CI run:   ${{ github.event.workflow_run.html_url || 'n/a (manual run)' }}"
          echo "CI says:  ${{ github.event.workflow_run.conclusion || 'n/a (manual run)' }}"
          echo "Deploying ${DEPLOY_SHA} from ${DEPLOY_REF}"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The verified commit, not the branch tip. They differ whenever something merged
          # while CI was still running -- which is exactly when a deploy is riskiest.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Always resolve the IP fresh from AWS — never trust a stale value
      - name: Resolve server IP from AWS
        id: resolve_ip
        run: |
          # Try the terraform job output first
          IP="${{ needs.terraform.outputs.server_public_ip }}"

          # If empty or looks wrong, query AWS directly for the EIP
          if [ -z "$IP" ] || [ "$IP" = "" ]; then
            echo "Job output empty — querying AWS for Elastic IP"
            IP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=dtp-staging-eip" \
              --query 'Addresses[0].PublicIp' \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Could not resolve server IP — aborting"
            exit 1
          fi

          echo "Server IP: $IP"
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install Ansible + Python AWS libraries
        run: |
          pip install --quiet \
            "ansible-core==2.16.*" \
            boto3 botocore awscli

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml --force || {
            echo "Galaxy collection install failed; retrying from pinned GitHub sources"
            ansible-galaxy collection install -r requirements.github.yml --force
          }

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/dtp-staging.pem
          chmod 600 ~/.ssh/dtp-staging.pem
          ssh-keygen -l -f ~/.ssh/dtp-staging.pem

      - name: Write Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [server]
          ${{ steps.resolve_ip.outputs.server_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/dtp-staging.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

          [all:vars]
          server_public_ip=${{ steps.resolve_ip.outputs.server_ip }}
          EOF
          cat inventory.ini

      - name: Wait for SSH (up to 3 minutes)
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          timeout 180 bash -c "
            until ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i ~/.ssh/dtp-staging.pem \
              ubuntu@$IP \
              'echo SSH_READY' 2>/dev/null | grep -q SSH_READY
            do
              echo '  not ready yet - retrying in 10s'
              sleep 10
            done
          "
          echo "SSH is up on $IP"

      - name: Wait for cloud-init to complete
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/dtp-staging.pem ubuntu@$IP \
            "cloud-init status --wait || true"
          echo "cloud-init done"

      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        run: |
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/db \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          APP_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/app \
            --region ${{ secrets.AWS_REGION }} \
            --query SecretString --output text)

          echo "POSTGRES_USER=$(echo $DB_SECRET  | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_USER"])')"  >> "$GITHUB_OUTPUT"
          echo "POSTGRES_DB=$(echo $DB_SECRET    | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_DB"])')"    >> "$GITHUB_OUTPUT"
          echo "ADMIN_API_KEY=$(echo $APP_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["ADMIN_API_KEY"])')"  >> "$GITHUB_OUTPUT"

          POSTGRES_PASSWORD=$(echo $DB_SECRET | python3 -c 'import sys,json; print(json.load(sys.stdin)["POSTGRES_PASSWORD"])')
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_OUTPUT"

      # ── Build the images here, not on the server ─────────────────────────
      #
      # This runner has 4 vCPUs and 16GB and builds both images in about three
      # minutes. The staging box is a t3.small sharing 2GB with Postgres; building
      # there exhausted its CPU credits and left it unable to answer SSH or HTTP
      # for hours. ECR is used rather than GHCR because the AWS credentials above
      # already exist — no new secret, and same-region pulls are fast and free.
      - name: Build and push images to ECR
        id: images
        # This job sets `working-directory: infra/ansible` for every run step, which
        # is right for ansible-playbook and wrong for docker build: the Dockerfiles
        # and the build context are at the repository root, and without this the
        # build fails with "lstat infra: no such file or directory".
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"
          REGISTRY="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
          # The verified commit, for the same reason the checkout uses it.
          TAG="${DEPLOY_SHA}"

          # Idempotent: the repositories are created on first deploy and left alone
          # afterwards, so this needs no terraform run.
          # Tags stay mutable: re-running a deploy on the same commit pushes the
          # same tag again, and an immutable repository would reject it.
          #
          # The lifecycle rule keeps the last ten images. Without it every deploy
          # adds a copy of both images and the bill grows quietly forever.
          LIFECYCLE='{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
          for repo in dtp-api dtp-web; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
            aws ecr put-lifecycle-policy --repository-name "$repo" \
              --lifecycle-policy-text "$LIFECYCLE" >/dev/null
          done

          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          docker build -f infra/api.Dockerfile -t "$REGISTRY/dtp-api:$TAG" .
          docker build -f infra/web.Dockerfile -t "$REGISTRY/dtp-web:$TAG" .
          docker push "$REGISTRY/dtp-api:$TAG"
          docker push "$REGISTRY/dtp-web:$TAG"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"

      # The server needs no AWS CLI and no AWS credentials of its own: the runner
      # mints a registry token here and hands it to Ansible. It is valid 12 hours.
      - name: Mint a registry token for the server
        id: registry_token
        run: |
          echo "::add-mask::$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})"
          echo "password=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})" >> "$GITHUB_OUTPUT"

      # Rollback needs a known-good tag, and the only trustworthy record of what is
      # serving traffic is the box itself. Captured before the playbook runs, because the
      # playbook rewrites this file with the new tag on its way past.
      - name: Record the image currently serving traffic
        id: previous
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/dtp-staging.pem ubuntu@$IP"

          TAG=$($SSH "sudo grep -hE '^IMAGE_TAG=' /opt/dtp-app/repo/infra/.env.staging | tail -1 | cut -d= -f2" 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            # A fresh box, or the file moved. Ask docker what it is actually running.
            TAG=$($SSH "sudo docker ps --format '{{.Image}}' | grep -m1 'dtp-api:' | sed 's/.*://'" 2>/dev/null || true)
          fi
          TAG=$(echo "$TAG" | tr -d "[:space:]")

          if [ "$TAG" = "$DEPLOY_SHA" ]; then
            # Re-running a deploy on the same commit. Putting that tag back would reinstall
            # exactly what just failed, so there is no rollback target worth the name.
            echo "::warning::The box is already serving $DEPLOY_SHA, so a rollback would redeploy the same commit. None will be attempted."
            TAG=""
          elif [ -n "$TAG" ]; then
            echo "Currently serving: $TAG"
          else
            echo "::warning::Could not read what is serving now, so this deploy cannot be rolled back automatically."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run Ansible playbook
        id: deploy_stack
        run: |
          REPO_URL="${{ secrets.GIT_REPO_URL }}"
          if [ -z "$REPO_URL" ] || [[ "$REPO_URL" != https://github.com/* ]]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi

          ansible-playbook playbook.yml \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=$REPO_URL" \
            -e "git_repo_token=${{ github.token }}" \
            -e "git_branch=${{ env.DEPLOY_REF }}" \
            -e "postgres_user=${{ steps.secrets.outputs.POSTGRES_USER }}" \
            -e "postgres_password=${{ steps.secrets.outputs.POSTGRES_PASSWORD }}" \
            -e "postgres_db=${{ steps.secrets.outputs.POSTGRES_DB }}" \
            -e "admin_api_key=${{ steps.secrets.outputs.ADMIN_API_KEY }}" \
            -e "image_registry=${{ steps.images.outputs.registry }}" \
            -e "image_tag=${{ steps.images.outputs.tag }}" \
            -e "registry_password=${{ steps.registry_token.outputs.password }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"

      - name: Verify deployment
        id: verify
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
            "http://$IP/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Health check passed (HTTP $HTTP)"
          else
            echo "Health check failed — got HTTP $HTTP"
            exit 1
          fi

      # ── If it did not come up, put back what was there ──────────────────────
      #
      # The gate above decides how often a bad deploy happens; this decides how long one
      # lasts. The images from the last ten deploys are still in ECR under the lifecycle
      # policy set earlier in this job, so the previous tag is nearly always pullable.
      #
      # It restores the **application, not the database**. Migrations are not run by this
      # deploy -- they are applied by hand through `docker exec` -- so there is normally
      # nothing to unwind. If a migration was run by hand for this release, the schema
      # stays migrated and a person has to decide what that means.
      - name: Roll back to the previous image
        id: rollback
        # Both ways a deploy goes wrong: the playbook died partway through, or it finished
        # and what came up does not answer. A half-applied deploy is not a safer state to
        # leave the box in than a broken one.
        if: >-
          always() &&
          steps.previous.outputs.tag != '' &&
          (steps.verify.outcome == 'failure' || steps.deploy_stack.outcome == 'failure')
        run: |
          echo "Deploy failed (playbook error or health check). Rolling back to ${{ steps.previous.outputs.tag }}"
          REPO_URL="${{ secrets.GIT_REPO_URL }}"
          if [ -z "$REPO_URL" ] || [[ "$REPO_URL" != https://github.com/* ]]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi

          ansible-playbook playbook.yml \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=$REPO_URL" \
            -e "git_repo_token=${{ github.token }}" \
            -e "git_branch=${{ env.DEPLOY_REF }}" \
            -e "postgres_user=${{ steps.secrets.outputs.POSTGRES_USER }}" \
            -e "postgres_password=${{ steps.secrets.outputs.POSTGRES_PASSWORD }}" \
            -e "postgres_db=${{ steps.secrets.outputs.POSTGRES_DB }}" \
            -e "admin_api_key=${{ steps.secrets.outputs.ADMIN_API_KEY }}" \
            -e "image_registry=${{ steps.images.outputs.registry }}" \
            -e "image_tag=${{ steps.previous.outputs.tag }}" \
            -e "registry_password=${{ steps.registry_token.outputs.password }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"

      - name: Verify the rollback
        if: always() && steps.rollback.outcome == 'success'
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" --max-time 10 \
            "http://$IP/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Rolled back to ${{ steps.previous.outputs.tag }} and the site is answering."
            echo "::warning::Deploy of ${DEPLOY_SHA} failed and was rolled back to ${{ steps.previous.outputs.tag }}."
          else
            echo "::error::Rollback did not restore service either (HTTP $HTTP). The box needs a person."
            exit 1
          fi

      - name: Nothing to roll back to
        if: >-
          always() &&
          steps.previous.outputs.tag == '' &&
          (steps.verify.outcome == 'failure' || steps.deploy_stack.outcome == 'failure')
        run: |
          echo "::error::The deploy failed and there was no previous image to put back, so nothing was rolled back. The box needs a person."

      - name: Deployment summary
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "========================================"
          echo "  Deployment complete"
          echo "  App:    http://$IP"
          echo "  Health: http://$IP/api/v1/health"
          echo "========================================"
