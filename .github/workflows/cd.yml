  # # ── Job 2: Ansible ────────────────────────────────────────────────────────
  deploy:
    name: Ansible deploy
    # needs: terraform
    # A manual run deploys on the operator's judgement; an automatic one deploys only a
    # commit whose CI run concluded `success`. Testing `conclusion` rather than the event
    # covers cancelled and timed-out runs too, neither of which is a pass.
    if: >-
      github.event.inputs.skip_deploy != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/ansible

    env:
      # The commit CI verified. Under `workflow_run`, GITHUB_SHA points at the default
      # branch rather than at the run being reacted to, so it is not safe to build from:
      # deploying a different commit than the one that passed is the bug being fixed here.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    steps:
      - name: Say what authorised this deploy
        # This job sets `working-directory: infra/ansible` for every run step, and this one
        # runs *before* the checkout, so that directory does not exist yet and bash cannot
        # start. The image-build step below carries the same override for the same reason.
        working-directory: ${{ github.workspace }}
        run: |
          echo "Trigger:  ${{ github.event_name }}"
          echo "CI run:   ${{ github.event.workflow_run.html_url || 'n/a (manual run)' }}"
          echo "CI says:  ${{ github.event.workflow_run.conclusion || 'n/a (manual run)' }}"
          echo "Deploying ${DEPLOY_SHA} from ${DEPLOY_REF}"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The verified commit, not the branch tip. They differ whenever something merged
          # while CI was still running -- which is exactly when a deploy is riskiest.
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # Always resolve the IP fresh from AWS — never trust a stale value
      - name: Resolve server IP from AWS
        id: resolve_ip
        run: |
          # Try the terraform job output first
          IP="${{ needs.terraform.outputs.server_public_ip }}"

          # If empty or looks wrong, query AWS directly for the EIP
          if [ -z "$IP" ] || [ "$IP" = "" ]; then
            echo "Job output empty — querying AWS for Elastic IP"
            IP=$(aws ec2 describe-addresses \
              --filters "Name=tag:Name,Values=dtp-staging-eip" \
              --query 'Addresses[0].PublicIp' \
              --output text 2>/dev/null || echo "")
          fi

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Could not resolve server IP — aborting"
            exit 1
          fi

          echo "Server IP: $IP"
          echo "server_ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Install Ansible + Python AWS libraries
        run: |
          pip install --quiet \
            "ansible-core==2.16.*" \
            boto3 botocore awscli

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r requirements.yml --force || {
            echo "Galaxy collection install failed; retrying from pinned GitHub sources"
            ansible-galaxy collection install -r requirements.github.yml --force
          }

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/dtp-staging.pem
          chmod 600 ~/.ssh/dtp-staging.pem
          ssh-keygen -l -f ~/.ssh/dtp-staging.pem

      - name: Write Ansible inventory
        run: |
          cat > inventory.ini <<EOF
          [server]
          ${{ steps.resolve_ip.outputs.server_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/dtp-staging.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ConnectTimeout=10'

          [all:vars]
          server_public_ip=${{ steps.resolve_ip.outputs.server_ip }}
          EOF
          cat inventory.ini

      - name: Wait for SSH (up to 3 minutes)
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "Waiting for SSH on $IP..."
          timeout 180 bash -c "
            until ssh \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              -o BatchMode=yes \
              -i ~/.ssh/dtp-staging.pem \
              ubuntu@$IP \
              'echo SSH_READY' 2>/dev/null | grep -q SSH_READY
            do
              echo '  not ready yet - retrying in 10s'
              sleep 10
            done
          "
          echo "SSH is up on $IP"

      - name: Wait for cloud-init to complete
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            -i ~/.ssh/dtp-staging.pem ubuntu@$IP \
            "cloud-init status --wait || true"
          echo "cloud-init done"

      # ── Secrets never enter a `run:` line ────────────────────────────────────
      #
      # Values read from Secrets Manager are not GitHub secrets, so the runner does
      # not mask them, and `${{ }}` expressions are expanded into the script text the
      # log prints. Until October 2026 the admin key and the R2 key id were passed to
      # Ansible that way and sat in plain text in every deploy log (docs/vision/50, C5).
      #
      # So: every fetched value is masked the moment it is read, and the playbook gets
      # them from a vars file written here with mode 0600, never from the command line.
      # The file lives in RUNNER_TEMP, which the runner discards with the job; the last
      # step removes it anyway.
      - name: Fetch secrets from AWS Secrets Manager
        id: secrets
        env:
          AWS_REGION_NAME: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          umask 077
          DB_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/db --region "$AWS_REGION_NAME" \
            --query SecretString --output text)
          APP_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id dtp/staging/app --region "$AWS_REGION_NAME" \
            --query SecretString --output text)

          DB_SECRET="$DB_SECRET" APP_SECRET="$APP_SECRET" python3 - <<'PY'
          import json, os, re

          db = json.loads(os.environ["DB_SECRET"])
          app = json.loads(os.environ["APP_SECRET"])

          def text(value):
              # Absent or null is empty. A JSON boolean becomes the lower-case word the
              # template and the API both read, not Python's "True".
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return "true" if value else "false"
              return str(value)

          # Values that grant access. Masked before anything else can print them.
          secret = {
              "postgres_password": text(db["POSTGRES_PASSWORD"]),
              "admin_api_key": text(app["ADMIN_API_KEY"]),
              "admin_jwt_secret": text(app.get("ADMIN_JWT_SECRET")),
              "academy_jwt_secret": text(app.get("ACADEMY_JWT_SECRET")),
              "vision_r2_access_key_id": text(app.get("VISION_R2_ACCESS_KEY_ID")),
              "vision_r2_secret_access_key": text(app.get("VISION_R2_SECRET_ACCESS_KEY")),
              # Off-box backups and the dead man's switches (roles/backup, roles/monitoring).
              # Optional: absent installs the timers with nowhere to send, and says so.
              # A heartbeat URL is a secret: anyone holding it can silence the alert.
              "backup_s3_access_key_id": text(app.get("BACKUP_S3_ACCESS_KEY_ID")),
              "backup_s3_secret_access_key": text(app.get("BACKUP_S3_SECRET_ACCESS_KEY")),
              "backup_heartbeat_url": text(app.get("BACKUP_HEARTBEAT_URL")),
              "disk_heartbeat_url": text(app.get("DISK_HEARTBEAT_URL")),
              # Optional: what Supersonic sends as X-Origin-Verify. Absent leaves nginx's
              # origin check off (infra/nginx.staging.conf).
              "origin_verify_secret": text(app.get("ORIGIN_VERIFY_SECRET")),
          }
          for value in secret.values():
              if value:
                  print(f"::add-mask::{value}", flush=True)

          # The API will not start in production without its session signing keys
          # (services/api/src/shared/jwt-secrets.ts). Stop here, before the server is
          # touched, rather than deploy containers that crash on boot.
          missing = [name for name in ("ADMIN_JWT_SECRET", "ACADEMY_JWT_SECRET") if not text(app.get(name)).strip()]
          if missing:
              print(f"::error::dtp/staging/app is missing {', '.join(missing)}. Add each as its own value (openssl rand -hex 32) and re-run.", flush=True)
              raise SystemExit(1)

          # The origin secret goes into nginx's config as a literal (envsubst), so a quote,
          # a semicolon or a brace would stop nginx from starting and take the site down.
          # Enforcing with no secret checks nothing, so it is a mistake worth stopping on.
          origin_secret = secret["origin_verify_secret"]
          origin_enforce = text(app.get("ORIGIN_VERIFY_ENFORCE")).strip()
          if origin_secret and not re.fullmatch(r"[A-Za-z0-9_-]{32,96}", origin_secret):
              print("::error::ORIGIN_VERIFY_SECRET must be 32 to 96 letters, digits, - or _ (openssl rand -hex 32).", flush=True)
              raise SystemExit(1)
          if origin_enforce not in ("", "0", "1"):
              print("::error::ORIGIN_VERIFY_ENFORCE must be 1, 0 or absent.", flush=True)
              raise SystemExit(1)
          if origin_enforce == "1" and not origin_secret:
              print("::error::ORIGIN_VERIFY_ENFORCE is 1 but ORIGIN_VERIFY_SECRET is empty.", flush=True)
              raise SystemExit(1)

          # Vision Engine keys are optional in the secret: absent means off (docs/vision/15).
          plain = {
              "postgres_user": text(db["POSTGRES_USER"]),
              "postgres_db": text(db["POSTGRES_DB"]),
              "vision_enabled": text(app.get("VISION_ENABLED")),
              "vision_storage_backend": text(app.get("VISION_STORAGE_BACKEND")),
              "vision_compute_provider": text(app.get("VISION_COMPUTE_PROVIDER")),
              "vision_r2_account_id": text(app.get("VISION_R2_ACCOUNT_ID")),
              "vision_r2_bucket_master": text(app.get("VISION_R2_BUCKET_MASTER")),
              "vision_r2_bucket_derived": text(app.get("VISION_R2_BUCKET_DERIVED")),
              "vision_r2_bucket_models": text(app.get("VISION_R2_BUCKET_MODELS")),
              "vision_r2_bucket_clips": text(app.get("VISION_R2_BUCKET_CLIPS")),
              "backup_s3_endpoint": text(app.get("BACKUP_S3_ENDPOINT")),
              "backup_s3_bucket": text(app.get("BACKUP_S3_BUCKET")),
              "origin_verify_enforce": origin_enforce,
          }

          path = os.path.join(os.environ["RUNNER_TEMP"], "deploy-secrets.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump({**plain, **secret}, f)
          print(f"Wrote {len(plain) + len(secret)} deploy variables to the vars file")
          PY
          echo "vars_file=$RUNNER_TEMP/deploy-secrets.json" >> "$GITHUB_OUTPUT"

      # ── Build the images here, not on the server ─────────────────────────
      #
      # This runner has 4 vCPUs and 16GB and builds both images in about three
      # minutes. The staging box is a t3.small sharing 2GB with Postgres; building
      # there exhausted its CPU credits and left it unable to answer SSH or HTTP
      # for hours. ECR is used rather than GHCR because the AWS credentials above
      # already exist — no new secret, and same-region pulls are fast and free.
      - name: Prepare the ECR repositories
        id: images
        # The job's default is infra/ansible; nothing here reads the tree, and the
        # build steps below take their paths from the repository root.
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGION="${{ secrets.AWS_REGION }}"
          REGISTRY="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
          # The verified commit, for the same reason the checkout uses it.
          TAG="${DEPLOY_SHA}"

          # Idempotent: the repositories are created on first deploy and left alone
          # afterwards, so this needs no terraform run.
          # Tags stay mutable: re-running a deploy on the same commit pushes the
          # same tag again, and an immutable repository would reject it.
          #
          # The lifecycle rule keeps the last ten images. Without it every deploy
          # adds a copy of both images and the bill grows quietly forever.
          LIFECYCLE='{"rules":[{"rulePriority":1,"description":"keep last 10","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
          for repo in dtp-api dtp-web dtp-vision-worker; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "$repo" >/dev/null
            aws ecr put-lifecycle-policy --repository-name "$repo" \
              --lifecycle-policy-text "$LIFECYCLE" >/dev/null
          done

          # Buildx pushes with the credentials this writes to ~/.docker/config.json.
          aws ecr get-login-password --region "$REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"

          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"

      # Buildx, for the GitHub Actions cache, as ci.yml builds. Plain `docker build`
      # started from nothing on every deploy: pnpm install and `apt-get install ffmpeg`
      # each time. Each image has its own cache scope; sharing the default one, each
      # build would overwrite the last one's cache.
      #
      # `context: .` (the checkout of DEPLOY_SHA), never the action's default, which
      # fetches the repository again at the workflow's own ref: under workflow_run that is
      # main's tip, not the commit CI verified.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          tags: ${{ steps.images.outputs.registry }}/dtp-api:${{ steps.images.outputs.tag }}
          push: true
          cache-from: type=gha,scope=cd-dtp-api
          cache-to: type=gha,scope=cd-dtp-api,mode=max

      - name: Build and push the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/web.Dockerfile
          tags: ${{ steps.images.outputs.registry }}/dtp-web:${{ steps.images.outputs.tag }}
          push: true
          cache-from: type=gha,scope=cd-dtp-web
          cache-to: type=gha,scope=cd-dtp-web,mode=max

      # The CPU worker (services/vision-worker/Dockerfile): FFmpeg and the worker
      # package, no CUDA. The same image a hosted CPU pod would run; on the box it
      # is started by the `vision` compose profile and provisions its own token.
      - name: Build and push the worker image
        uses: docker/build-push-action@v7
        with:
          context: services/vision-worker
          tags: ${{ steps.images.outputs.registry }}/dtp-vision-worker:${{ steps.images.outputs.tag }}
          push: true
          cache-from: type=gha,scope=cd-dtp-vision-worker
          cache-to: type=gha,scope=cd-dtp-vision-worker,mode=max

      # The server needs no AWS CLI and no AWS credentials of its own: the runner
      # mints a registry token here and hands it to Ansible. It is valid 12 hours.
      #
      # Minted once. This used to call get-login-password twice, masking the first token
      # and handing the second, unmasked, to Ansible's command line.
      - name: Mint a registry token for the server
        id: registry_token
        env:
          AWS_REGION_NAME: ${{ secrets.AWS_REGION }}
          VARS_FILE: ${{ steps.secrets.outputs.vars_file }}
        run: |
          set -euo pipefail
          TOKEN=$(aws ecr get-login-password --region "$AWS_REGION_NAME")
          echo "::add-mask::$TOKEN"
          TOKEN="$TOKEN" python3 - <<'PY'
          import json, os
          path = os.environ["VARS_FILE"]
          with open(path) as f:
              data = json.load(f)
          data["registry_password"] = os.environ["TOKEN"]
          with open(path, "w") as f:
              json.dump(data, f)
          PY

      # Rollback needs a known-good tag, and the only trustworthy record of what is
      # serving traffic is the box itself. Captured before the playbook runs, because the
      # playbook rewrites this file with the new tag on its way past.
      - name: Record the image currently serving traffic
        id: previous
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          SSH="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/dtp-staging.pem ubuntu@$IP"

          TAG=$($SSH "sudo grep -hE '^IMAGE_TAG=' /opt/dtp-app/repo/infra/.env.staging | tail -1 | cut -d= -f2" 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            # A fresh box, or the file moved. Ask docker what it is actually running.
            TAG=$($SSH "sudo docker ps --format '{{.Image}}' | grep -m1 'dtp-api:' | sed 's/.*://'" 2>/dev/null || true)
          fi
          TAG=$(echo "$TAG" | tr -d "[:space:]")

          if [ "$TAG" = "$DEPLOY_SHA" ]; then
            # Re-running a deploy on the same commit. Putting that tag back would reinstall
            # exactly what just failed, so there is no rollback target worth the name.
            echo "::warning::The box is already serving $DEPLOY_SHA, so a rollback would redeploy the same commit. None will be attempted."
            TAG=""
          elif [ -n "$TAG" ]; then
            echo "Currently serving: $TAG"
          else
            echo "::warning::Could not read what is serving now, so this deploy cannot be rolled back automatically."
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run Ansible playbook
        id: deploy_stack
        run: |
          REPO_URL="${{ secrets.GIT_REPO_URL }}"
          if [ -z "$REPO_URL" ] || [[ "$REPO_URL" != https://github.com/* ]]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi

          ansible-playbook playbook.yml \
            -e "@$VARS_FILE" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=$REPO_URL" \
            -e "git_repo_token=${{ github.token }}" \
            -e "git_branch=${{ env.DEPLOY_REF }}" \
            -e "image_registry=${{ steps.images.outputs.registry }}" \
            -e "git_version=${{ env.DEPLOY_SHA }}" \
            -e "image_tag=${{ steps.images.outputs.tag }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"
          VARS_FILE:             ${{ steps.secrets.outputs.vars_file }}

      # Asked on the box, over SSH. Once nginx's origin check is enforcing, a request to
      # http://$IP from the runner is a direct caller and gets 403; loopback always passes
      # (infra/nginx.staging.conf). This proves the stack answers, not that Supersonic
      # reaches it: the uptime monitor on https://dtp.africa covers that.
      - name: Verify deployment
        id: verify
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/dtp-staging.pem "ubuntu@$IP" \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Health check passed (HTTP $HTTP)"
          else
            echo "Health check failed — got HTTP $HTTP"
            exit 1
          fi

      # ── Tell CloudFront the HTML changed ────────────────────────────────────
      #
      # CloudFront keeps HTML up to an hour (default_ttl in infra/terraform/main.tf), so
      # after a deploy visitors were still handed the old index.html, which names the old
      # hashed bundles. /assets/* needs nothing: new builds have new file names.
      #
      # The first 1,000 invalidation paths a month are free; this uses two per deploy.
      # Deep links (/scoreboard, /players/...) are cached under their own paths and still
      # age out on the hour; "/*" would clear them too, and counts as one path, but empties
      # the year-long /assets cache with it.
      #
      # Only after the deploy verified. Set the repository variable
      # CLOUDFRONT_DISTRIBUTION_ID (Settings > Secrets and variables > Actions > Variables;
      # `terraform output cloudfront_id`). Unset skips this. A failure warns and does not
      # fail a deploy that is already live; the deploy user needs
      # cloudfront:CreateInvalidation.
      - name: Invalidate the CloudFront HTML cache
        if: steps.verify.outcome == 'success'
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "${DISTRIBUTION_ID}" ]; then
            echo "CLOUDFRONT_DISTRIBUTION_ID is not set; skipping the invalidation. HTML refreshes within the hour."
            exit 0
          fi
          if ID=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
              --paths "/index.html" "/" --query 'Invalidation.Id' --output text); then
            echo "Invalidation $ID created for /index.html and /"
          else
            echo "::warning::CloudFront invalidation failed. The deploy is live; HTML refreshes within the hour."
          fi

      # ── If it did not come up, put back what was there ──────────────────────
      #
      # The gate above decides how often a bad deploy happens; this decides how long one
      # lasts. The images from the last ten deploys are still in ECR under the lifecycle
      # policy set earlier in this job, so the previous tag is nearly always pullable.
      #
      # It restores the **application, not the database**. The deploy applies migrations
      # forward only, before the swap (`prisma migrate deploy`); the rollback passes
      # run_migrations=false and the image no longer runs `db push` on start, so the
      # schema stays where the newer release put it. Migrations are additive, so the
      # older image runs against it; a person decides anything more than that.
      - name: Roll back to the previous image
        id: rollback
        # Both ways a deploy goes wrong: the playbook died partway through, or it finished
        # and what came up does not answer. A half-applied deploy is not a safer state to
        # leave the box in than a broken one.
        if: >-
          always() &&
          steps.previous.outputs.tag != '' &&
          (steps.verify.outcome == 'failure' || steps.deploy_stack.outcome == 'failure')
        run: |
          echo "Deploy failed (playbook error or health check). Rolling back to ${{ steps.previous.outputs.tag }}"
          REPO_URL="${{ secrets.GIT_REPO_URL }}"
          if [ -z "$REPO_URL" ] || [[ "$REPO_URL" != https://github.com/* ]]; then
            REPO_URL="https://github.com/${{ github.repository }}.git"
          fi

          ansible-playbook playbook.yml \
            -e "@$VARS_FILE" \
            -e "aws_region=${{ secrets.AWS_REGION }}" \
            -e "git_repo_url=$REPO_URL" \
            -e "git_repo_token=${{ github.token }}" \
            -e "git_branch=${{ env.DEPLOY_REF }}" \
            -e "image_registry=${{ steps.images.outputs.registry }}" \
            -e "git_version=${{ steps.previous.outputs.tag }}" \
            -e "run_migrations=false" \
            -e "image_tag=${{ steps.previous.outputs.tag }}"
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
          ANSIBLE_FORCE_COLOR:   "1"
          VARS_FILE:             ${{ steps.secrets.outputs.vars_file }}

      - name: Verify the rollback
        if: always() && steps.rollback.outcome == 'success'
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          HTTP=$(ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ~/.ssh/dtp-staging.pem "ubuntu@$IP" \
            "curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1/api/v1/health" || echo "000")
          if [ "$HTTP" = "200" ]; then
            echo "Rolled back to ${{ steps.previous.outputs.tag }} and the site is answering."
            echo "::warning::Deploy of ${DEPLOY_SHA} failed and was rolled back to ${{ steps.previous.outputs.tag }}."
          else
            echo "::error::Rollback did not restore service either (HTTP $HTTP). The box needs a person."
            exit 1
          fi

      - name: Nothing to roll back to
        if: >-
          always() &&
          steps.previous.outputs.tag == '' &&
          (steps.verify.outcome == 'failure' || steps.deploy_stack.outcome == 'failure')
        run: |
          echo "::error::The deploy failed and there was no previous image to put back, so nothing was rolled back. The box needs a person."

      - name: Deployment summary
        run: |
          IP="${{ steps.resolve_ip.outputs.server_ip }}"
          echo "========================================"
          echo "  Deployment complete"
          echo "  App:    http://$IP"
          echo "  Health: http://$IP/api/v1/health"
          echo "========================================"

      - name: Remove the deploy vars file
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-secrets.json"
