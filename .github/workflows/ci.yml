name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# Required for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dtp:dtp@localhost:5432/dtp_africa
      ADMIN_API_KEY: ci-admin-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # ── Each step writes pass/fail to a results file ──────────────────────
      # The report is built at the end from this file regardless of failures.

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
        continue-on-error: true

      - name: Generate Prisma client
        id: prisma_generate
        run: pnpm --filter @dtp/api prisma:generate
        continue-on-error: true

      - name: Validate Prisma schema
        id: prisma_validate
        run: pnpm --filter @dtp/api exec prisma validate
        continue-on-error: true

      - name: Build engines
        id: build_engines
        run: pnpm --filter @dtp/engines build
        continue-on-error: true

      - name: Build UI package
        id: build_ui
        run: pnpm --filter @dtp/ui build
        continue-on-error: true

      - name: Run engines tests
        id: test_engines
        run: pnpm --filter @dtp/engines test
        continue-on-error: true

      - name: Run API tests
        id: test_api
        run: pnpm --filter @dtp/api test
        continue-on-error: true

      - name: Typecheck workspace
        id: typecheck
        run: pnpm typecheck
        continue-on-error: true

      - name: Build API
        id: build_api
        run: pnpm --filter @dtp/api build
        continue-on-error: true

      - name: Build web
        id: build_web
        run: pnpm --filter @dtp/web build
        continue-on-error: true

      - name: Validate staging compose
        id: compose_validate
        run: docker compose --env-file infra/.env.staging.example -f infra/docker-compose.staging.yml config
        continue-on-error: true

      # ── Build report ──────────────────────────────────────────────────────

      - name: Generate build and test report
        if: always()
        run: |
          # Count results
          PASS=0; FAIL=0
          declare -A RESULTS
          for STEP_OUTCOME in \
            "Install dependencies:${{ steps.install.outcome }}" \
            "Generate Prisma client:${{ steps.prisma_generate.outcome }}" \
            "Validate Prisma schema:${{ steps.prisma_validate.outcome }}" \
            "Build engines:${{ steps.build_engines.outcome }}" \
            "Build UI package:${{ steps.build_ui.outcome }}" \
            "Engines tests:${{ steps.test_engines.outcome }}" \
            "API tests:${{ steps.test_api.outcome }}" \
            "Typecheck workspace:${{ steps.typecheck.outcome }}" \
            "Build API:${{ steps.build_api.outcome }}" \
            "Build web:${{ steps.build_web.outcome }}" \
            "Validate staging compose:${{ steps.compose_validate.outcome }}"
          do
            OUTCOME="${STEP_OUTCOME##*:}"
            [ "$OUTCOME" = "success" ] && PASS=$((PASS+1)) || FAIL=$((FAIL+1))
          done

          OVERALL="✅ PASSED"
          [ $FAIL -gt 0 ] && OVERALL="❌ FAILED"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # ── GitHub Job Summary ──────────────────────────────────────────────
          cat >> $GITHUB_STEP_SUMMARY << EOF
          # DTP Africa — CI Pipeline Report
          **${OVERALL}** &nbsp;|&nbsp; Branch: \`${{ github.ref_name }}\` &nbsp;|&nbsp; Commit: \`${{ github.sha }}\`

          ---

          ## 🏗️ Build Steps
          | Step | Status |
          |---|---|
          | Install dependencies | ${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Generate Prisma client | ${{ steps.prisma_generate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Validate Prisma schema | ${{ steps.prisma_validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Build @dtp/engines | ${{ steps.build_engines.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Build @dtp/ui | ${{ steps.build_ui.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Typecheck workspace | ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Build API | ${{ steps.build_api.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Build web | ${{ steps.build_web.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | Validate staging compose | ${{ steps.compose_validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |

          ## 🧪 Test Results
          | Suite | Status |
          |---|---|
          | @dtp/engines unit tests | ${{ steps.test_engines.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |
          | @dtp/api unit tests | ${{ steps.test_api.outcome == 'success' && '✅ Passed' || '❌ Failed' }} |

          ---
          **Total:** ${PASS} passed, ${FAIL} failed &nbsp;|&nbsp; **Actor:** ${{ github.actor }} &nbsp;|&nbsp; **Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          > 📥 Download the full Allure HTML report from the **Artifacts** section below.
          EOF

          # ── Downloadable HTML Report ────────────────────────────────────────
          mkdir -p report
          cat > report/pipeline-report.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>DTP Africa — CI Pipeline Report</title>
            <style>
              * { box-sizing: border-box; }
              body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
                     max-width: 900px; margin: 40px auto; padding: 0 24px; color: #24292f; background: #f6f8fa; }
              h1, h2 { border-bottom: 1px solid #d0d7de; padding-bottom: 10px; }
              h2 { margin-top: 32px; font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; color: #57606a; }
              .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px 24px; margin: 16px 0; }
              .badge { display:inline-block; padding:3px 10px; border-radius:12px; font-weight:600; font-size:13px; }
              .pass  { background:#dafbe1; color:#116329; }
              .fail  { background:#ffebe9; color:#82071e; }
              .warn  { background:#fff8c5; color:#9a6700; }
              table  { width:100%; border-collapse:collapse; margin:12px 0; }
              th     { background:#f6f8fa; text-align:left; padding:8px 14px; border:1px solid #d0d7de; font-size:12px; }
              td     { padding:8px 14px; border:1px solid #d0d7de; font-size:13px; }
              tr:hover td { background:#f6f8fa; }
              .meta  { color:#656d76; font-size:12px; margin:6px 0; }
              .headline { font-size:1.4rem; font-weight:700; margin:4px 0; }
              .grid  { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
            </style>
          </head>
          <body>
            <div class="card">
              <p class="headline">
                <span class="badge $([ $FAIL -gt 0 ] && echo 'fail' || echo 'pass')">
                  $([ $FAIL -gt 0 ] && echo '❌ PIPELINE FAILED' || echo '✅ PIPELINE PASSED')
                </span>
              </p>
              <div class="grid">
                <div>
                  <p class="meta">🌿 Branch</p>
                  <strong>${{ github.ref_name }}</strong>
                </div>
                <div>
                  <p class="meta">📝 Commit</p>
                  <code>${{ github.sha }}</code>
                </div>
                <div>
                  <p class="meta">👤 Actor</p>
                  <strong>${{ github.actor }}</strong>
                </div>
                <div>
                  <p class="meta">🕐 Generated</p>
                  <strong>${TIMESTAMP}</strong>
                </div>
                <div>
                  <p class="meta">✅ Passed</p>
                  <strong style="color:#116329; font-size:1.2rem">${PASS}</strong>
                </div>
                <div>
                  <p class="meta">❌ Failed</p>
                  <strong style="color:$([ $FAIL -gt 0 ] && echo '#82071e' || echo '#116329'); font-size:1.2rem">${FAIL}</strong>
                </div>
              </div>
            </div>

            <h2>🧪 Test Results</h2>
            <table>
              <thead><tr><th>Suite</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td>@dtp/engines unit tests</td>
                    <td><span class="badge ${{ steps.test_engines.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.test_engines.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>@dtp/api unit tests</td>
                    <td><span class="badge ${{ steps.test_api.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.test_api.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
              </tbody>
            </table>

            <h2>🏗️ Build Steps</h2>
            <table>
              <thead><tr><th>Step</th><th>Status</th></tr></thead>
              <tbody>
                <tr><td>Install dependencies</td>
                    <td><span class="badge ${{ steps.install.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.install.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Generate Prisma client</td>
                    <td><span class="badge ${{ steps.prisma_generate.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.prisma_generate.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Validate Prisma schema</td>
                    <td><span class="badge ${{ steps.prisma_validate.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.prisma_validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Build @dtp/engines</td>
                    <td><span class="badge ${{ steps.build_engines.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.build_engines.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Build @dtp/ui</td>
                    <td><span class="badge ${{ steps.build_ui.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.build_ui.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Typecheck workspace</td>
                    <td><span class="badge ${{ steps.typecheck.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.typecheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Build API</td>
                    <td><span class="badge ${{ steps.build_api.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.build_api.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Build web</td>
                    <td><span class="badge ${{ steps.build_web.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.build_web.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
                <tr><td>Validate staging compose</td>
                    <td><span class="badge ${{ steps.compose_validate.outcome == 'success' && 'pass' || 'fail' }}">${{ steps.compose_validate.outcome == 'success' && '✅ Passed' || '❌ Failed' }}</span></td></tr>
              </tbody>
            </table>

            <p class="meta" style="margin-top:32px">
              For the full interactive Allure report with test details, categories and history,
              download the <strong>allure-report</strong> artifact from the GitHub Actions run.
            </p>
          </body>
          </html>
          HTMLEOF

      - name: Install Allure CLI and generate HTML report
        if: always()
        run: |
          npm install -g allure-commandline --quiet

          echo "=== Checking for allure results ==="
          find . -name "*.json" -path "*/allure-results*" 2>/dev/null | head -20 || true
          ls -la allure-results/ 2>/dev/null || echo "allure-results/ not found at root"
          ls -la allure-results/engines/ 2>/dev/null || echo "allure-results/engines/ not found"
          ls -la allure-results/api/ 2>/dev/null || echo "allure-results/api/ not found"

          # Create merged results directory
          mkdir -p allure-results-merged

          # Copy from each package output directory
          if [ -d "allure-results/engines" ] && [ "$(ls -A allure-results/engines 2>/dev/null)" ]; then
            echo "Copying engines results..."
            cp -r allure-results/engines/. allure-results-merged/
          fi

          if [ -d "allure-results/api" ] && [ "$(ls -A allure-results/api 2>/dev/null)" ]; then
            echo "Copying API results..."
            cp -r allure-results/api/. allure-results-merged/
          fi

          echo "=== Merged results ==="
          ls -la allure-results-merged/ || echo "No merged results"

          mkdir -p report/allure-html
          if [ "$(ls -A allure-results-merged 2>/dev/null)" ]; then
            allure generate allure-results-merged --clean -o report/allure-html
            echo "Allure report generated successfully"
          else
            echo "No test results found — generating empty report placeholder"
            echo "<html><body><h1>No test results yet</h1><p>Run CI to generate results.</p></body></html>" > report/allure-html/index.html
          fi

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: report/pipeline-report.html
          retention-days: 30

      - name: Upload Allure raw results (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-raw
          path: allure-results-merged
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: report/allure-html
          retention-days: 30

      - name: Deploy Allure report to GitHub Pages
        # Only publish from main/dev push — not PRs
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report/allure-html
          destination_dir: allure-report
          commit_message: "ci: update Allure report [run ${{ github.run_number }}]"

      # ── Fail the job if any step failed ───────────────────────────────────
      - name: Check for failures
        if: always()
        run: |
          if [[ \
            "${{ steps.install.outcome }}"          != "success" || \
            "${{ steps.prisma_generate.outcome }}"  != "success" || \
            "${{ steps.prisma_validate.outcome }}"  != "success" || \
            "${{ steps.build_engines.outcome }}"    != "success" || \
            "${{ steps.build_ui.outcome }}"         != "success" || \
            "${{ steps.test_engines.outcome }}"     != "success" || \
            "${{ steps.test_api.outcome }}"         != "success" || \
            "${{ steps.typecheck.outcome }}"        != "success" || \
            "${{ steps.build_api.outcome }}"        != "success" || \
            "${{ steps.build_web.outcome }}"        != "success" || \
            "${{ steps.compose_validate.outcome }}" != "success" \
          ]]; then
            echo "One or more pipeline steps failed — see report above"
            exit 1
          fi
