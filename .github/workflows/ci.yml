name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - features

jobs:
  # Every other check in this workflow asks whether the code is correct. None of them asks
  # where the merge goes, and that is a different question with its own failure.
  #
  # PR #157 -- the recorder submit guards -- was merged into `feat/recorder-idle-lock`, the
  # head branch of #156, six minutes after #156 had already merged to main. Its commit went
  # into a branch main had finished with. GitHub reported it as "Merged", every check was
  # green, and two features the product owner had asked for sat invisible for a day. Nothing
  # was broken: the code was fine, the tests passed, and nobody was looking at the
  # destination.
  #
  # Branch protection would not have caught it either. Protection on `main` governs merges
  # *into* main; it never sees a pull request whose base is a feature branch.
  pr-targets-a-branch-that-ships:
    name: PR targets a branch that ships
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: The base branch must be one that deploys
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "main" ] || [ "$BASE" = "dev" ]; then
            echo "Targets $BASE. Merging this reaches the deploy pipeline."
            exit 0
          fi

          echo "::error::This pull request targets '$BASE', which is not a branch that ships."
          echo ""
          echo "  $HEAD  ->  $BASE"
          echo ""
          echo "Merging it moves the commits into $BASE and nowhere else. If $BASE has"
          echo "already merged to main, they reach nothing at all -- GitHub will still say"
          echo "Merged and every other check here will still be green."
          echo ""
          echo "Retarget the base to main (Edit, beside the title). For stacked work, keep"
          echo "the base as main: the diff collapses on its own once the branch below it"
          echo "merges, which is how every stacked pull request in this repo has been done."
          exit 1

  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://dtp:dtp@localhost:5432/dtp_africa
      ADMIN_API_KEY: ci-admin-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dtp/api prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter @dtp/api exec prisma validate

      - name: Build engines
        run: pnpm --filter @dtp/engines build

      - name: Build UI package
        run: pnpm --filter @dtp/ui build

      - name: Run engines tests
        run: pnpm --filter @dtp/engines test

      # The shared Vision vocabulary has its own tests, including the version pin
      # the Python worker checks itself against. They existed but had never run here.
      - name: Run vision contracts tests
        run: pnpm --filter @dtp/vision-contracts test

      - name: Run API tests
        run: pnpm --filter @dtp/api test

      # The web app's first tests, added with the annotation workstation: its time and
      # frame arithmetic decides whether a stored label means what it says.
      - name: Run web tests
        run: pnpm --filter @dtp/web test

      # 3.12 to match the worker image (services/vision-worker/Dockerfile), so CI
      # runs the interpreter production runs. No ffmpeg needed: the stage tests fake
      # the subprocess, and media.py has no isolated tests yet.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision-worker/pyproject.toml

      - name: Install vision worker
        working-directory: services/vision-worker
        run: pip install -e ".[dev]"

      # Includes the cross-language contract guard, which reads the TypeScript
      # source and fails if the Python side has drifted. `-rs` surfaces any skip in
      # the log; the guard itself refuses to skip while CI is set.
      - name: Run vision worker tests
        working-directory: services/vision-worker
        run: pytest -v -rs

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Build API
        run: pnpm --filter @dtp/api build

      - name: Build web
        run: pnpm --filter @dtp/web build

      - name: Validate staging compose
        run: docker compose --env-file infra/.env.staging.example -f infra/docker-compose.staging.yml config

      # The worker sits behind the `vision` profile, so the step above never read its
      # block: a typo there was found by a deploy, on the server. This reads it, and
      # holds it to the three things the deploy depends on -- the bootstrap
      # entrypoint, an init as PID 1, and a memory ceiling on a 2 GB box.
      - name: Validate staging compose with the vision worker
        run: |
          set -euo pipefail
          compose() { docker compose --profile vision --env-file infra/.env.staging.example -f infra/docker-compose.staging.yml "$@"; }
          # Into a variable first. Piped straight into `grep -q`, grep exits at the first match
          # and compose is killed writing the rest; under `pipefail` that is a failure, so this
          # step failed now and then with the worker plainly defined.
          services=$(compose config --services)
          grep -qx worker <<< "$services" || { echo "::error::The vision profile does not define a worker service."; exit 1; }
          rendered=$(compose config)
          for needle in "dtp_vision_worker.bootstrap" "init: true" "mem_limit:"; do
            grep -q -- "$needle" <<< "$rendered" || { echo "::error::The worker service lost \"$needle\"."; exit 1; }
          done
          echo "The worker service is defined, with its entrypoint, an init and a memory limit."

      # The entrypoint compose runs is `dtp_vision_worker.bootstrap`, not the package's
      # default. With nothing configured it must refuse and say what is missing, exit 2:
      # under `restart: unless-stopped` anything else is a silent crash loop.
      - name: The worker bootstrap refuses an empty configuration
        working-directory: services/vision-worker
        run: |
          set +e
          output=$(env -u VISION_BOOTSTRAP_TOKEN -u VISION_WORKER_CALLBACK_URL -u VISION_PROVISION_KEY -u VISION_PROVISION_API_KEY -u VISION_RESOURCE_CLASS python -m dtp_vision_worker.bootstrap 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "::error::Expected exit 2 from an unconfigured bootstrap, got $status"
            exit 1
          fi
          for setting in VISION_WORKER_CALLBACK_URL VISION_PROVISION_KEY VISION_RESOURCE_CLASS; do
            grep -q "$setting" <<< "$output" || { echo "::error::The bootstrap no longer names $setting"; exit 1; }
          done

      # The deploy playbook was the one thing here nothing checked, and it is the
      # thing whose failures cost the most: a typo in it is found by a deploy going
      # red after the images are already built and pushed, against the live server.
      # A syntax check catches an unresolvable module, a malformed task and a broken
      # Jinja expression in about thirty seconds.
      - name: Validate the deploy playbook
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install community.general
          ansible-playbook infra/ansible/playbook.yml --syntax-check -i 'localhost,'

      # The worker is given a key derived from the operator key, and the API derives the
      # same key to recognise it (docs/vision/67). Three places compute it: the API, the
      # deploy's env template, and a shell line in this workflow. The API's is pinned by a
      # test with a known answer. This renders the template's own line with Ansible and
      # holds it to the shell's answer for a key made up on the spot, so the three cannot
      # drift apart and leave the worker on the box unable to provision itself.
      - name: The deploy derives the provision key as the API does
        run: |
          set -euo pipefail
          key=$(openssl rand -hex 16)
          want=$(printf 'vision-worker-provision-v1:%s' "$key" | sha256sum | cut -d' ' -f1)
          line=$(grep '^VISION_PROVISION_KEY=' infra/ansible/roles/deploy/templates/staging.env.j2)
          printf -- '- hosts: localhost\n  gather_facts: false\n  tasks:\n    - debug:\n        msg: "%s"\n' "$line" > "$RUNNER_TEMP/derive.yml"
          rendered=$(ansible-playbook "$RUNNER_TEMP/derive.yml" -i 'localhost,' -c local -e "{\"app_creds\": {\"ADMIN_API_KEY\": \" $key \"}}")
          got=$(grep -o 'VISION_PROVISION_KEY=[0-9a-f]*' <<< "$rendered" | head -1)
          if [ "$got" != "VISION_PROVISION_KEY=$want" ]; then
            echo "::error::The deploy template and the shell derive different provision keys."
            echo "template line: $line"
            exit 1
          fi
          echo "The deploy template derives the key the API expects."
  # ── API image ─────────────────────────────────────────────────────────────
  #
  # **This job exists because of an outage.** The API's compiled output requires
  # @dtp/vision-contracts by package name, the Dockerfile did not build it, and every
  # check here still passed — because the *compiler* does not need that package built,
  # only the *runtime* does. The image built cleanly, the container died on boot with
  # MODULE_NOT_FOUND, nginx answered 502 and dtp.africa served only static pages.
  #
  # So this runs on **pull requests**, unlike the worker image: a change that stops the
  # API starting must be caught before it reaches main, not after. `needs: verify`
  # because building an image for code that fails its tests proves nothing.
  # Three times in one evening a schema change reached main without a migration, and each
  # time it was invisible until somebody went looking: the recorder idle-lock columns, the
  # competition status default, and the submit-guard timestamps. Staging never noticed --
  # the API image ran `db:push` on start then -- so the only thing that broke was provisioning
  # a database from `prisma/migrations`. Since docs/vision/52 the deploy itself applies
  # `prisma/migrations` with `migrate deploy`, so a missing migration now fails a deploy.
  #
  # DEPLOYMENT.md asked a human to re-run this check whenever a migration was added. That
  # instruction went stale twice. This is the same check, run by a machine.
  #
  # It asserts the invariant rather than the paperwork: **the migrations must build the
  # current schema**. A comment-only edit to schema.prisma therefore passes, and drift is
  # caught whichever pull request introduced it -- neither of which a "did this diff touch
  # both files?" rule could manage.
  #
  # Because CD now deploys only after the whole CI workflow succeeds, a failure here also
  # blocks the deploy. That is intended: a database that cannot be rebuilt is a release
  # problem, not a paperwork problem.
  schema-migrations:
    name: Migrations build the schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shadow
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        # Prisma connects immediately; without a healthcheck the first step races the
        # database and fails on a cold runner.
        options: >-
          --health-cmd "pg_isready -U shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `migrate diff` replays every migration into the shadow database, so a migration
      # with broken SQL fails here too, not only a missing one.
      - name: The migrations must build the current schema
        working-directory: services/api
        env:
          SHADOW_URL: postgresql://shadow:shadow@localhost:5432/shadow
        run: |
          set -euo pipefail
          EMPTY="-- This is an empty migration."

          forward=$(pnpm exec prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "$SHADOW_URL" --script | grep -v "^$" || true)

          if [ "$forward" != "$EMPTY" ]; then
            echo "::error::prisma/migrations does not build schema.prisma. A new database would be missing this:"
            echo "$forward"
            echo ""
            echo "Add a migration under services/api/prisma/migrations/ containing that SQL."
            echo "Use IF NOT EXISTS: every database that exists today was built by db push."
            exit 1
          fi

          # The other direction catches a migration that adds something the schema does not
          # describe -- a hand-written migration that overshot, or a schema change reverted
          # without reverting its migration.
          reverse=$(pnpm exec prisma migrate diff --from-schema-datamodel ./prisma/schema.prisma --to-migrations ./prisma/migrations --shadow-database-url "$SHADOW_URL" --script | grep -v "^$" || true)

          if [ "$reverse" != "$EMPTY" ]; then
            echo "::error::prisma/migrations describes something schema.prisma does not:"
            echo "$reverse"
            exit 1
          fi

          echo "Migrations and schema agree in both directions."

      # The command a person runs to provision a new database. Diffing proves the end state
      # matches; this proves the sequence applies, including the bookkeeping in
      # _prisma_migrations that diffing skips.
      - name: A new database can be built from them
        working-directory: services/api
        env:
          PGPASSWORD: shadow
        run: |
          set -euo pipefail
          psql -h localhost -U shadow -d shadow -c "CREATE DATABASE fromzero;"
          DATABASE_URL="postgresql://shadow:shadow@localhost:5432/fromzero" pnpm exec prisma migrate deploy

  # ── Vision gates ──────────────────────────────────────────────────────────
  #
  # The gates are the tests that run the control plane for real: a database, a
  # booted API, HTTP. Until this job none of them ran anywhere but a developer's
  # machine, and three had been failing on expectations nobody had brought along
  # (docs/vision/61).
  #
  # It runs twenty-one of the twenty-two (docs/vision/65). Thirteen of them put an
  # object in the store for the API to read, or read one the API wrote, so the gate
  # and the API have to see one store. That is the `s3mock` service below: the API's
  # R2 backend speaks S3, and is pointed at it. The mock checks no signature and
  # keeps nothing; what it proves is the control plane's own logic about keys,
  # prefixes, write-once masters and presigned URLs, not Cloudflare's behaviour.
  # The lists are `DB_GATES` and `STORE_GATES` in services/api/scripts/run-db-gates.ts.
  #
  # The twenty-second, `vision:e2echeck`, runs last, in a step of its own: it builds
  # the worker's image and runs the container against this API and this store
  # (docs/vision/66). That is why the store's endpoint is `host.docker.internal` and
  # not `localhost`: a presigned URL is handed to the worker inside its container,
  # and it has to mean the same place there as it does out here.
  #
  # The database starts empty: the migrations and the RBAC seed are all it has.
  # Every gate makes its own partner, footage, people and match, so none depends
  # on what a developer happens to have seeded.
  vision-gates:
    name: Vision gates against a real database
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gates:gates@localhost:5432/gates
      VISION_ENABLED: "true"
      PORT: "3000"
      VISION_E2E_API: http://localhost:3000/api/v1
      # The object store: the R2 backend, pointed at the mock. Bucket names only; the
      # two credential-shaped values are generated below.
      VISION_STORAGE_BACKEND: r2
      VISION_R2_ENDPOINT: http://host.docker.internal:9090
      VISION_R2_BUCKET_MASTER: gates-master
      VISION_R2_BUCKET_DERIVED: gates-derived
      VISION_R2_BUCKET_MODELS: gates-models
      VISION_R2_BUCKET_CLIPS: gates-clips

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gates
          POSTGRES_PASSWORD: gates
          POSTGRES_DB: gates
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      # An S3 server for tests: no credentials to manage, the four buckets made at
      # start. Pinned to a version, because the answer to "does this gate pass" must
      # not change when somebody else publishes an image.
      s3mock:
        image: adobe/s3mock:5.2.3
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: gates-master,gates-derived,gates-models,gates-clips
        ports:
          - 9090:9090

    steps:
      # A Linux runner does not know this name; Docker Desktop on a laptop does. The
      # worker's container is given it with --add-host, pointing at the host. Here it
      # points at the host from the host, so one URL works on both sides.
      - name: Name the host as the worker's container will
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generated per run and masked, never written into the repository: a literal
      # secret-shaped value in a workflow is indistinguishable from a real one. The
      # mock accepts any pair; the API's configuration only requires that there is one.
      - name: Throwaway credentials for this run
        run: |
          for name in ADMIN_API_KEY ADMIN_JWT_SECRET ACADEMY_JWT_SECRET VISION_R2_ACCESS_KEY_ID VISION_R2_SECRET_ACCESS_KEY; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Build the database from the migrations
        working-directory: services/api
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Seed the roles
        run: pnpm --filter @dtp/api seed:rbac

      # The API resolves these two from their build output.
      - name: Build the packages the API imports
        run: |
          pnpm --filter @dtp/vision-contracts build
          pnpm --filter @dtp/engines build

      - name: Start the API
        working-directory: services/api
        run: |
          nohup node -r @swc-node/register src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS "http://localhost:3000/api/v1/health" > /dev/null 2>&1; then
              echo "The API answered after $attempt attempt(s)."
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/api.pid")" 2> /dev/null; then
              echo "::error::The API exited while starting."
              tail -60 "$RUNNER_TEMP/api.log"
              exit 1
            fi
            sleep 2
          done
          echo "::error::The API did not answer its health check in two minutes."
          tail -60 "$RUNNER_TEMP/api.log"
          exit 1

      # Seven gates run the worker's own Python for the arithmetic they check: the
      # tracker, the metrics, the kit clustering, the cut proposals, the game state.
      # 3.12 to match the worker image.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision-worker/pyproject.toml

      - name: Install vision worker
        working-directory: services/vision-worker
        run: |
          pip install -e .
          echo "VISION_WORKER_PYTHON=$(which python)" >> "$GITHUB_ENV"

      # The service has no health check of its own; it takes some seconds to start.
      - name: Wait for the object store
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "$VISION_R2_ENDPOINT/" 2> /dev/null | grep -q "gates-master"; then
              echo "The object store answered after $attempt attempt(s), with its buckets."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The object store did not answer with its buckets in two minutes."
          curl -sS "$VISION_R2_ENDPOINT/" | head -c 600 || true
          exit 1

      - name: Run the gates
        run: pnpm --filter @dtp/api vision:gates:ci

      # The path the staging box takes: the bootstrap entrypoint provisions itself with
      # the provision key, derived here as the deploy derives it and never the admin
      # key itself, registers, asks for work, finds none, and retires. Every step of
      # that is a request to the API above; nothing else in CI makes them.
      - name: The worker bootstrap provisions, registers and retires against the API
        working-directory: services/vision-worker
        env:
          VISION_WORKER_CALLBACK_URL: http://localhost:3000/api/v1/vision/worker
          VISION_PROVIDER_ID: local
          VISION_RESOURCE_CLASS: cpu_small
          VISION_IDLE_SHUTDOWN_SECONDS: "5"
        run: |
          set +e
          provision_key=$(printf 'vision-worker-provision-v1:%s' "$ADMIN_API_KEY" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$provision_key"
          output=$(env -u ADMIN_API_KEY VISION_PROVISION_KEY="$provision_key" VISION_WORK_DIR="$RUNNER_TEMP/dtp-vision" timeout 180 python -m dtp_vision_worker.bootstrap 2>&1)
          status=$?
          set -e
          tail -30 <<< "$output"
          if [ "$status" -ne 0 ]; then
            echo "::error::The bootstrap exited $status; a worker on the box would be restarting in a loop."
            exit 1
          fi
          for step in "provisioned worker" "registered as worker" "queue drained" "/retire"; do
            grep -q -- "$step" <<< "$output" || { echo "::error::The bootstrap never reached: $step"; exit 1; }
          done
          echo "The worker provisioned itself, registered, found no work and retired."

      # ── The end-to-end gate ───────────────────────────────────────────────
      #
      # Everything above runs the control plane with the worker's part played by the
      # gate. This runs the worker: the image built from this commit, as a container,
      # registering, claiming a probe and a transcode and a cuts job for a real clip,
      # reading the master and writing the proxy through presigned URLs, with FFmpeg.
      # It is the only check that the image and the API of one commit work together.
      #
      # After the gates, so a failing gate does not wait for an image to build. The
      # layers are cached; nearly all the build is `apt-get install ffmpeg`, which
      # changes only when the Dockerfile does.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: services/vision-worker
          tags: dtp-vision-worker:ci
          # Into the local image store: the gate runs it with `docker run`.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the end-to-end gate with the worker's container
        env:
          VISION_E2E_IMAGE: dtp-vision-worker:ci
        run: pnpm --filter @dtp/api vision:e2echeck test-media/sample-360p.mp4

      - name: The API's log, if anything failed
        if: failure()
        run: tail -200 "$RUNNER_TEMP/api.log" || true

  api-image:
    name: Build and boot the API image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/api.Dockerfile
          tags: dtp-api:ci
          # Required: without it buildx leaves the result in its own cache and the
          # boot step below fails on a missing image while the build still passes.
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `docker build` exiting 0 is exactly the signal that failed us, so the image
      # has to be started. The container is pointed at a deliberately unroutable
      # address (192.0.2.0/24 is reserved for documentation), so it can reach no real
      # database and this check can never touch one. Prisma then fails with P1001,
      # which is the expected ending — what matters is everything that happens first.
      #
      # The CMD is deliberately NOT used: it runs a data repair script before start, which
      # must never run from CI. (It used to run `db push --accept-data-loss` as well; the
      # deploy now applies migrations as its own step, docs/vision/52.)
      - name: The image boots far enough to reach its database
        run: |
          # Credential-shaped values are generated per run, never written into the
          # repository. They are throwaway by construction — the container talks to an
          # unroutable address and serves no request — but a literal
          # ADMIN_JWT_SECRET="..." in a workflow is indistinguishable from a real one
          # to a reader and to a secret scanner, and "it is only a test value" is
          # exactly what gets said shortly before a real one lands. GitGuardian was
          # right to flag the first version of this step.
          throwaway() { openssl rand -hex 24; }

          set +e
          output=$(docker run --rm --entrypoint sh             -e DATABASE_URL="postgresql://ci:$(throwaway)@192.0.2.1:5432/none?connect_timeout=2"             -e ADMIN_API_KEY="$(throwaway)"             -e ADMIN_JWT_SECRET="$(throwaway)"             dtp-api:ci -c 'cd /app/services/api && timeout 120 node dist/services/api/src/main.js 2>&1')
          set -e

          # Herestrings rather than pipes: `echo "$output" | tail` makes the shell
          # report a broken pipe once tail has read its 40 lines, which litters the log
          # and would fail the step outright under `pipefail`.
          tail -40 <<< "$output"

          if grep -qE "MODULE_NOT_FOUND|Cannot find module" <<< "$output"; then
            echo "::error::The API container cannot resolve a module at runtime. This is the failure that took the site down: a workspace package the compiled output requires by name is not built in the image. Check infra/api.Dockerfile."
            exit 1
          fi

          if ! grep -q "dependencies initialized" <<< "$output"; then
            echo "::error::The API container did not initialise any Nest module. It is not starting at all."
            exit 1
          fi

          # Named explicitly because VisionModule is the one that imports the package
          # that broke. If Vision is ever renamed, update this line and say so.
          if ! grep -q "VisionModule dependencies initialized" <<< "$output"; then
            echo "::error::VisionModule did not initialise, so its imports are not resolving inside the image."
            exit 1
          fi

          echo "The API image starts, wires every module and reaches its database."

  # ── Worker image ──────────────────────────────────────────────────────────
  #
  # Main pushes only. Nothing else in CI builds this image, so a Dockerfile that
  # no longer builds would pass every check and fail at deploy — but an ffmpeg
  # image on every pull request is minutes of runner time per push, so it is paid
  # once per merge instead.
  #
  # `needs: verify` because building an image for code that fails its tests proves
  # nothing. Nothing is pushed to a registry here: this job answers "does it
  # build and start", and publishing is the deploy workflow's job.
  worker-image:
    name: Build the vision worker image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx, for the GitHub Actions cache backend below.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: services/vision-worker
          tags: dtp-vision-worker:ci
          # **Required.** Buildx otherwise leaves the result in its own build cache
          # and never in the local image store, so every `docker run` step below
          # fails with "no such image". The build still passes, which is what makes
          # this an easy one to get wrong.
          load: true
          # Nearly all the build time is `apt-get install ffmpeg`, an early layer
          # that only changes when the Dockerfile does — so it hits on almost every
          # run, while the later COPY and pip layers rebuild as the worker changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds but produces an image whose entrypoint cannot start
      # is the failure this job exists to catch, and `docker build` alone would not
      # see it. Running with no configuration proves the entrypoint resolves, the
      # package imported and its dependencies installed: the worker refuses to
      # start and names every missing setting, exiting 2.
      - name: The image starts and refuses an empty configuration
        run: |
          set +e
          output=$(docker run --rm dtp-vision-worker:ci 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "::error::Expected exit 2 from an unconfigured worker, got $status"
            exit 1
          fi
          for setting in VISION_WORKER_CALLBACK_URL VISION_BOOTSTRAP_TOKEN VISION_RESOURCE_CLASS; do
            echo "$output" | grep -q "$setting" || {
              echo "::error::Startup validation no longer names $setting"
              exit 1
            }
          done

      # Compose overrides the entrypoint with `python -m dtp_vision_worker.bootstrap`.
      # The step above proves the default one; this proves the one the box runs.
      - name: The bootstrap entrypoint starts in the image and refuses an empty configuration
        run: |
          set +e
          output=$(docker run --rm --entrypoint python dtp-vision-worker:ci -m dtp_vision_worker.bootstrap 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "::error::Expected exit 2 from an unconfigured bootstrap, got $status"
            exit 1
          fi
          grep -q "VISION_PROVISION_KEY" <<< "$output" || { echo "::error::The bootstrap no longer names VISION_PROVISION_KEY"; exit 1; }

      # ffmpeg is the reason this image is as large as it is. If an apt-get line is
      # ever dropped the stages break at runtime and nowhere else.
      - name: ffmpeg is present
        run: docker run --rm --entrypoint ffmpeg dtp-vision-worker:ci -version

      # The Dockerfile promises an unprivileged worker. A regression here is silent.
      - name: The image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id dtp-vision-worker:ci -u)
          echo "runs as uid $uid"
          [ "$uid" != "0" ] || { echo "::error::The worker image runs as root"; exit 1; }

      # CUDA-free on purpose: probe, fingerprint and transcode are CPU-bound, and a
      # GPU image would mean paying GPU rates for FFmpeg. The GPU image does NOT build
      # FROM this one (Dockerfile.gpu explains why), but both images now install the same
      # package -- including the `detect` stage -- so this check matters more than it did:
      # `detect` must keep importing torch lazily, or the CPU image grows a 2.5 GB
      # dependency it can never use.
      - name: The CPU image carries no GPU stack
        run: |
          packages=$(docker run --rm --entrypoint pip dtp-vision-worker:ci list)
          found=$(echo "$packages" | grep -ciE "^(torch|nvidia|tensorrt)" || true)
          echo "GPU packages found: $found"
          [ "$found" = "0" ] || { echo "::error::GPU packages leaked into the CPU image"; exit 1; }

      # The other half of that split, and the reason the lazy import exists. The stage
      # registry names `detect`; importing it must not need torch, or this image cannot
      # start at all.
      - name: The CPU image loads a registry that names a GPU stage
        run: |
          docker run --rm --entrypoint python dtp-vision-worker:ci -c \
            "from dtp_vision_worker.stages import CPU_STAGES, GPU_STAGES, STAGES; \
             assert set(STAGES) == CPU_STAGES | GPU_STAGES; \
             print('registry loaded without torch:', sorted(STAGES))"

  # Not on the default path: the CUDA base plus cu124 torch is several GB to pull and
  # build, which is minutes and disk on every push for an image only a GPU pod runs. It is
  # manual **and** it exists because two things in Dockerfile.gpu cannot be verified on a
  # machine with no Docker daemon: that the CUDA tag and jammy's python3.11 both resolve,
  # and that the venv puts torch where the entry point looks (see docs/vision/
  # 27-SPIKE-S0-SURPRISES.md, S0-3). Run it before spending pod time.
  gpu-image:
    name: Build the GPU image (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ~14 GB free on a hosted runner, and the CUDA base with torch does not comfortably
      # fit beside a preinstalled Android SDK and .NET.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The Dockerfile's own last layer imports torch, torchvision, cv2, boto3 and the
      # stage registry, so a build that succeeds has already proved the stack resolves.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: services/vision-worker
          file: services/vision-worker/Dockerfile.gpu
          tags: dtp-vision-engine:ci
          load: true
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,mode=max,scope=gpu

      # No GPU on a hosted runner, so CUDA itself is untested here -- `torch.cuda.is_available()`
      # is false and the stage logs a warning and falls back. What this proves is that the
      # benchmark harness Spike S0 depends on is installed and runnable in the image.
      - name: The benchmark harness is installed
        run: docker run --rm --entrypoint dtp-vision-bench dtp-vision-engine:ci --help

      - name: The GPU image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint id dtp-vision-engine:ci -u)
          echo "runs as uid $uid"
          [ "$uid" != "0" ] || { echo "::error::The GPU worker image runs as root"; exit 1; }

      - name: ffmpeg is present in the GPU image too
        run: docker run --rm --entrypoint ffmpeg dtp-vision-engine:ci -version
