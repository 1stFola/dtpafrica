[project]
name = "dtp-vision-worker"
version = "0.1.0"
description = "DTP Vision Engine worker — claims jobs over HTTP, processes media, writes artifacts to object storage"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    # Game-state chunks are Parquet (docs/vision/04 § CV outputs). Apache-2.0; registered in
    # docs/licenses/OSS_REGISTER.md.
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
dtp-vision-worker = "dtp_vision_worker.__main__:main"
# Spike S0 measures itself from inside the image; see dtp_vision_worker/bench.py.
dtp-vision-bench = "dtp_vision_worker.bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
