  set_real_ip_from 54.182.248.0/22;
  set_real_ip_from 54.239.134.0/23;
  set_real_ip_from 54.239.170.0/23;
  set_real_ip_from 54.239.204.0/22;
  set_real_ip_from 54.239.208.0/21;
  set_real_ip_from 64.252.128.0/18;
  set_real_ip_from 64.252.64.0/18;
  set_real_ip_from 70.132.0.0/18;
  set_real_ip_from 2001:3fc6:3c::/47;
  set_real_ip_from 2001:3fc6:4::/48;
  set_real_ip_from 2001:3fc6:5::/48;
  set_real_ip_from 2406:da10:847f:a100::/56;
  set_real_ip_from 2406:da11:438:2300::/56;
  set_real_ip_from 2406:da12:4b:c200::/56;
  set_real_ip_from 2406:da12:8b2e:9c00::/56;
  set_real_ip_from 2406:da14:17bd:2f00::/56;
  set_real_ip_from 2406:da14:80bb:ea00::/56;
  set_real_ip_from 2406:da16:c01:c200::/56;
  set_real_ip_from 2406:da18:9fa:1b00::/56;
  set_real_ip_from 2406:da19:e19:4a00::/56;
  set_real_ip_from 2406:da1a:6df:6c00::/56;
  set_real_ip_from 2406:da1b:e7c:ad00::/56;
  set_real_ip_from 2406:da1c:787:2b00::/56;
  set_real_ip_from 2406:da1c:8d8c:4600::/56;
  set_real_ip_from 2406:da1e:705:1600::/56;
  set_real_ip_from 2406:da1f:396:9100::/56;
  set_real_ip_from 2600:1f11:e79:a800::/56;
  set_real_ip_from 2600:1f13:417:4d00::/56;
