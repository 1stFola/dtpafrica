# The origin secret below is a map key, and nginx's default bucket (64 bytes) cannot hold a
# 64-character one: nginx then refuses to start. 128 holds keys up to 96 characters, the
# most cd.yml lets through. It has to come before the first map, or nginx calls it a
# duplicate of the default that map already took.
map_hash_bucket_size 128;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# ── Origin check: only Supersonic may use this server ──────────────────────────
#
# This file is a template. The nginx image runs envsubst over it at start, so the
# ORIGIN_VERIFY_SECRET and ORIGIN_VERIFY_ENFORCE placeholders in the maps below become
# the values from the container's environment (web.Dockerfile defaults both to empty).
# Only names set in the environment are substituted; nginx's own variables are left
# alone. Never write either placeholder in a comment: envsubst fills comments too.
#
# Supersonic adds X-Origin-Verify to every request it sends here (a request header set in
# the Supersonic dashboard). A request without it did not come through the CDN: someone
# called the Elastic IP directly, and could have written anything in X-Forwarded-For.
#
# $origin_verify, written to the access log as origin=, says what each request was:
#   off     no secret set; nothing is checked (local development, CI, before rollout)
#   cdn     the header carried the secret
#   local   loopback or Docker's bridge: the deploy's health checks on the box itself
#   direct  anything else; refused with 403 only once enforcing is on
# Rollout is staged on this (infra/DEPLOYMENT.md, "Origin lock"): set the secret, have
# Supersonic send it, watch origin=cdn replace origin=direct in the log, then enforce.
#
# $realip_remote_addr is the connection's own address, before X-Forwarded-For is applied,
# so no header can claim to be local. Port 80 admits no IPv6 (security-groups.tf), so the
# bridge range cannot be reached through Docker's IPv6 proxy either.
map "${ORIGIN_VERIFY_SECRET}" $origin_verify_secret_set {
  "" 0;
  default 1;
}
map $http_x_origin_verify $origin_verify_header_ok {
  default 0;
  "${ORIGIN_VERIFY_SECRET}" 1;
}
geo $realip_remote_addr $origin_verify_local {
  default 0;
  127.0.0.0/8 1;
  172.16.0.0/12 1;
  ::1 1;
}
map "$origin_verify_secret_set:$origin_verify_header_ok:$origin_verify_local" $origin_verify {
  default direct;
  ~^0: off;
  ~^1:1: cdn;
  ~^1:0:1$ local;
}
map "${ORIGIN_VERIFY_ENFORCE}" $origin_verify_enforce {
  "1" 1;
  default 0;
}
# The emergency off-switch edits this line in the running container (DEPLOYMENT.md).
map "$origin_verify_enforce:$origin_verify" $origin_verify_denied {
  default 0;
  "1:direct" 1;
}

# The image's default format, plus origin=. The header's value is never logged.
log_format origin_check '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" origin=$origin_verify';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log origin_check;

  # The visitor's address, which the API rate-limits logins and public forms by.
  #
  # dtp.africa is fronted by Namecheap Supersonic, not CloudFront (no distribution exists),
  # and Supersonic does not publish the ranges it connects from. Trusting only CloudFront
  # made every visitor look like a Supersonic edge, so all of them shared one rate-limit
  # bucket. Until the origin is locked to the CDN, any source is trusted, but only the LAST
  # X-Forwarded-For entry is taken (real_ip_recursive off): the address the CDN appended, not
  # whatever the visitor wrote in front of it. Someone calling the origin IP directly can
  # still forge that entry; that closes once the origin check below is enforcing, because
  # such a request is refused before anything reads the address.
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  # Kept for a move of DNS to CloudFront, when the two lines above go and these become the
  # whole list (with recursive back on). Regenerate with
  # `node infra/scripts/refresh-cloudfront-real-ip.mjs`; do not edit by hand.
  # BEGIN cloudfront-origin-facing
  # https://ip-ranges.amazonaws.com/ip-ranges.json createDate 2026-10-17-11-07-06
  set_real_ip_from 13.124.199.0/24;
  set_real_ip_from 130.176.0.0/18;
  set_real_ip_from 130.176.128.0/21;
  set_real_ip_from 130.176.136.0/23;
  set_real_ip_from 130.176.140.0/22;
  set_real_ip_from 130.176.144.0/20;
  set_real_ip_from 130.176.160.0/19;
  set_real_ip_from 130.176.192.0/19;
  set_real_ip_from 130.176.64.0/21;
  set_real_ip_from 130.176.72.0/22;
  set_real_ip_from 130.176.76.0/24;
  set_real_ip_from 130.176.78.0/23;
  set_real_ip_from 130.176.80.0/22;
  set_real_ip_from 130.176.86.0/23;
  set_real_ip_from 130.176.88.0/21;
  set_real_ip_from 130.176.96.0/19;
  set_real_ip_from 15.158.0.0/16;
  set_real_ip_from 18.68.0.0/16;
  set_real_ip_from 204.246.166.0/24;
  set_real_ip_from 205.251.218.0/24;
  set_real_ip_from 24.110.128.0/17;
  set_real_ip_from 3.172.0.0/18;
  set_real_ip_from 3.172.64.0/18;
  set_real_ip_from 3.29.57.0/26;
  set_real_ip_from 51.74.20.0/24;
  set_real_ip_from 51.74.21.0/24;
  set_real_ip_from 51.74.22.0/24;
  set_real_ip_from 52.46.0.0/18;
  set_real_ip_from 52.82.128.0/23;
  set_real_ip_from 52.82.134.0/23;
  set_real_ip_from 54.182.128.0/20;
  set_real_ip_from 54.182.144.0/21;
  set_real_ip_from 54.182.154.0/23;
  set_real_ip_from 54.182.156.0/22;
  set_real_ip_from 54.182.160.0/21;
  set_real_ip_from 54.182.172.0/22;
  set_real_ip_from 54.182.176.0/21;
  set_real_ip_from 54.182.184.0/22;
  set_real_ip_from 54.182.188.0/23;
  set_real_ip_from 54.182.224.0/21;
  set_real_ip_from 54.182.240.0/21;
  set_real_ip_from 54.182.248.0/22;
  set_real_ip_from 54.239.134.0/23;
  set_real_ip_from 54.239.170.0/23;
  set_real_ip_from 54.239.204.0/22;
  set_real_ip_from 54.239.208.0/21;
  set_real_ip_from 64.252.128.0/18;
  set_real_ip_from 64.252.64.0/18;
  set_real_ip_from 70.132.0.0/18;
  set_real_ip_from 2001:3fc6:3c::/47;
  set_real_ip_from 2001:3fc6:4::/48;
  set_real_ip_from 2001:3fc6:5::/48;
  set_real_ip_from 2406:da10:847f:a100::/56;
  set_real_ip_from 2406:da11:438:2300::/56;
  set_real_ip_from 2406:da12:4b:c200::/56;
  set_real_ip_from 2406:da12:8b2e:9c00::/56;
  set_real_ip_from 2406:da14:17bd:2f00::/56;
  set_real_ip_from 2406:da14:80bb:ea00::/56;
  set_real_ip_from 2406:da16:c01:c200::/56;
  set_real_ip_from 2406:da18:9fa:1b00::/56;
  set_real_ip_from 2406:da19:e19:4a00::/56;
  set_real_ip_from 2406:da1a:6df:6c00::/56;
  set_real_ip_from 2406:da1b:e7c:ad00::/56;
  set_real_ip_from 2406:da1c:787:2b00::/56;
  set_real_ip_from 2406:da1c:8d8c:4600::/56;
  set_real_ip_from 2406:da1e:705:1600::/56;
  set_real_ip_from 2406:da1f:396:9100::/56;
  set_real_ip_from 2600:1f11:e79:a800::/56;
  set_real_ip_from 2600:1f13:417:4d00::/56;
  set_real_ip_from 2600:1f16:1923:3000::/56;
  set_real_ip_from 2600:1f17:4356:f100::/56;
  set_real_ip_from 2600:1f18:7530:7200::/56;
  set_real_ip_from 2600:1f1a:4568:b500::/56;
  set_real_ip_from 2600:1f1c:da:600::/56;
  set_real_ip_from 2600:1f1e:a7:2300::/56;
  set_real_ip_from 2600:9000:1000::/36;
  set_real_ip_from 2600:9000:5200::/40;
  set_real_ip_from 2600:9000:6000::/36;
  set_real_ip_from 2a05:d011:531:1800::/56;
  set_real_ip_from 2a05:d012:581:b400::/56;
  set_real_ip_from 2a05:d014:1362:b000::/56;
  set_real_ip_from 2a05:d016:9ed:de00::/56;
  set_real_ip_from 2a05:d018:1a3a:2d00::/56;
  set_real_ip_from 2a05:d019:80b:e300::/56;
  set_real_ip_from 2a05:d01a:8a9:be00::/56;
  set_real_ip_from 2a05:d01c:343:c300::/56;
  set_real_ip_from 2a05:d025:e59:fb00::/56;
  # END cloudfront-origin-facing
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # The origin secret stops here; the API has no use for it and should never log it.
    proxy_set_header X-Origin-Verify "";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location = /scoreboard {
    try_files /index.html =404;
  }

  location = /scoreboard/ {
    return 308 /scoreboard;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Security headers ──────────────────────────────────────────────────────
  #
  # Every response, API included, errors included (`always`). CloudFront passes them through
  # to the viewer. Locations here set no add_header of their own; one that did would drop
  # all of these for that location, because nginx does not merge add_header across levels.
  #
  # The Content-Security-Policy, one directive per line:
  #   script-src   the Vite bundle only. No inline script, no eval; index.html has none.
  #   style-src    React style={} attributes are inline styles, hence 'unsafe-inline';
  #                Google Fonts serves the stylesheets index.html links.
  #   img-src      https: because player photos, crests, ads and imports come from any host
  #                an admin pastes (TheSportsDB, Wikimedia, YouTube thumbnails, R2).
  #   media-src    Vision review video plays from presigned R2 URLs; https: as for images.
  #   connect-src  the API and its live-audio WebSocket ('self' covers wss: in current
  #                browsers; the hosts are named for older Safari. Not $host: CloudFront
  #                sends the origin's ec2-* name as Host), presigned R2 reads
  #                (Vision game state), and the TheSportsDB headshot search.
  #   frame-src    YouTube and Google Drive embeds (MediaVideoEmbed, LiveStreamCard).
  set $csp "default-src 'self'; ";
  set $csp "${csp}script-src 'self'; ";
  set $csp "${csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; ";
  set $csp "${csp}font-src 'self' data: https://fonts.gstatic.com; ";
  set $csp "${csp}img-src 'self' data: blob: https:; ";
  set $csp "${csp}media-src 'self' blob: https:; ";
  set $csp "${csp}connect-src 'self' wss://dtp.africa wss://www.dtp.africa https://*.r2.cloudflarestorage.com https://www.thesportsdb.com; ";
  set $csp "${csp}frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; ";
  set $csp "${csp}worker-src 'self' blob:; ";
  set $csp "${csp}object-src 'none'; ";
  set $csp "${csp}base-uri 'self'; ";
  set $csp "${csp}form-action 'self'; ";
  set $csp "${csp}frame-ancestors 'self'";
  add_header Content-Security-Policy $csp always;
  # A year, this host only. No includeSubDomains or preload until every dtp.africa
  # subdomain is known to serve HTTPS: both are hard to take back.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  # For browsers that predate frame-ancestors.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # The origin check (maps at the top). Server level, so it runs before any location; last
  # in the block because server-level set and if run in order, and above here the 403
  # would go out before $csp is built, without its Content-Security-Policy.
  if ($origin_verify_denied) {
    return 403;
  }
}
