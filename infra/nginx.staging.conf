  set_real_ip_from 2600:1f1a:4568:b500::/56;
  set_real_ip_from 2600:1f1c:da:600::/56;
  set_real_ip_from 2600:1f1e:a7:2300::/56;
  set_real_ip_from 2600:9000:1000::/36;
  set_real_ip_from 2600:9000:5200::/40;
  set_real_ip_from 2600:9000:6000::/36;
  set_real_ip_from 2a05:d011:531:1800::/56;
  set_real_ip_from 2a05:d012:581:b400::/56;
  set_real_ip_from 2a05:d014:1362:b000::/56;
  set_real_ip_from 2a05:d016:9ed:de00::/56;
  set_real_ip_from 2a05:d018:1a3a:2d00::/56;
  set_real_ip_from 2a05:d019:80b:e300::/56;
  set_real_ip_from 2a05:d01a:8a9:be00::/56;
  set_real_ip_from 2a05:d01c:343:c300::/56;
  set_real_ip_from 2a05:d025:e59:fb00::/56;
  # END cloudfront-origin-facing
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location = /scoreboard {
    try_files /index.html =404;
  }

  location = /scoreboard/ {
    return 308 /scoreboard;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Security headers ──────────────────────────────────────────────────────
  #
  # Every response, API included, errors included (`always`). CloudFront passes them through
  # to the viewer. Locations here set no add_header of their own; one that did would drop
  # all of these for that location, because nginx does not merge add_header across levels.
  #
  # The Content-Security-Policy, one directive per line:
  #   script-src   the Vite bundle only. No inline script, no eval; index.html has none.
  #   style-src    React style={} attributes are inline styles, hence 'unsafe-inline';
  #                Google Fonts serves the stylesheets index.html links.
  #   img-src      https: because player photos, crests, ads and imports come from any host
  #                an admin pastes (TheSportsDB, Wikimedia, YouTube thumbnails, R2).
  #   media-src    Vision review video plays from presigned R2 URLs; https: as for images.
  #   connect-src  the API and its live-audio WebSocket ('self' covers wss: in current
  #                browsers; the hosts are named for older Safari. Not $host: CloudFront
  #                sends the origin's ec2-* name as Host), presigned R2 reads
  #                (Vision game state), and the TheSportsDB headshot search.
  #   frame-src    YouTube and Google Drive embeds (MediaVideoEmbed, LiveStreamCard).
  set $csp "default-src 'self'; ";
  set $csp "${csp}script-src 'self'; ";
  set $csp "${csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; ";
  set $csp "${csp}font-src 'self' data: https://fonts.gstatic.com; ";
  set $csp "${csp}img-src 'self' data: blob: https:; ";
  set $csp "${csp}media-src 'self' blob: https:; ";
  set $csp "${csp}connect-src 'self' wss://dtp.africa wss://www.dtp.africa https://*.r2.cloudflarestorage.com https://www.thesportsdb.com; ";
  set $csp "${csp}frame-src https://www.youtube.com https://www.youtube-nocookie.com https://drive.google.com; ";
  set $csp "${csp}worker-src 'self' blob:; ";
  set $csp "${csp}object-src 'none'; ";
  set $csp "${csp}base-uri 'self'; ";
  set $csp "${csp}form-action 'self'; ";
  set $csp "${csp}frame-ancestors 'self'";
  add_header Content-Security-Policy $csp always;
  # A year, this host only. No includeSubDomains or preload until every dtp.africa
  # subdomain is known to serve HTTPS: both are hard to take back.
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  # For browsers that predate frame-ancestors.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
