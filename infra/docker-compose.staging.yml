name: dtp-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dtp_africa}
    volumes:
      - dtp_staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtp} -d ${POSTGRES_DB:-dtp_africa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Built and pushed by CI, never built here. The staging box is a t3.small:
    # compiling on it burned its CPU credits and left it unable to answer SSH or
    # HTTP for hours. IMAGE_TAG is the commit SHA, so a deploy is reproducible and
    # a rollback is a tag change.
    image: ${IMAGE_REGISTRY}/dtp-api:${IMAGE_TAG}
    # `build` stays for deploy.sh, the manual path, which builds on the box it runs
    # on. CI's deploy never reaches it: Ansible pulls this exact tag first and fails
    # if the pull does not succeed, so `up` always finds the image already present.
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dtp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtp_africa}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      OCR_SPACE_ENGINE: ${OCR_SPACE_ENGINE:-3}
      # Vision Engine. Every one empty until the dtp/staging/app secret carries it, and
      # VISION_ENABLED unset keeps the module off (docs/vision/15): a deploy without the
      # secret changes nothing.
      VISION_ENABLED: ${VISION_ENABLED:-}
      VISION_STORAGE_BACKEND: ${VISION_STORAGE_BACKEND:-}
      VISION_COMPUTE_PROVIDER: ${VISION_COMPUTE_PROVIDER:-}
      VISION_R2_ACCOUNT_ID: ${VISION_R2_ACCOUNT_ID:-}
      VISION_R2_ACCESS_KEY_ID: ${VISION_R2_ACCESS_KEY_ID:-}
      VISION_R2_SECRET_ACCESS_KEY: ${VISION_R2_SECRET_ACCESS_KEY:-}
      VISION_R2_BUCKET_MASTER: ${VISION_R2_BUCKET_MASTER:-}
      VISION_R2_BUCKET_DERIVED: ${VISION_R2_BUCKET_DERIVED:-}
      VISION_R2_BUCKET_MODELS: ${VISION_R2_BUCKET_MODELS:-}
      VISION_R2_BUCKET_CLIPS: ${VISION_R2_BUCKET_CLIPS:-}
      # What a provisioned worker row records as its image: the one this stack runs.
      VISION_WORKER_IMAGE: ${IMAGE_REGISTRY}/dtp-vision-worker:${IMAGE_TAG}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  web:
    image: ${IMAGE_REGISTRY}/dtp-web:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # The CPU worker, beside the API. It runs only under the `vision` profile, which
  # the env file switches on when VISION_ENABLED is true, so a stack with Vision off
  # has no worker polling an API that refuses it. It provisions its own bootstrap
  # token through the API with the operator key (dtp_vision_worker/bootstrap.py),
  # claims CPU stages -- probe, fingerprint, transcode, cuts, track, identify,
  # gamestate -- and talks to the store through presigned URLs alone: no R2
  # credential, no database connection. Detect needs a GPU and stays on a pod.
  #
  # One worker, one job at a time, on a t3.small shared with Postgres and the API:
  # enough for a match's CPU stages, not for a queue of them.
  worker:
    image: ${IMAGE_REGISTRY}/dtp-vision-worker:${IMAGE_TAG}
    build:
      context: ../services/vision-worker
    profiles: ["vision"]
    restart: unless-stopped
    depends_on:
      - api
    entrypoint: ["python", "-m", "dtp_vision_worker.bootstrap"]
    environment:
      VISION_WORKER_CALLBACK_URL: http://api:3000/api/v1/vision/worker
      VISION_PROVISION_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      VISION_PROVIDER_ID: local
      VISION_RESOURCE_CLASS: cpu_small
      VISION_WORKER_IMAGE: ${IMAGE_REGISTRY}/dtp-vision-worker:${IMAGE_TAG}
      # A day idle before it exits and the restart policy provisions a fresh one;
      # the hosted default of two minutes is for pods that cost money while idle.
      VISION_IDLE_SHUTDOWN_SECONDS: "86400"
      VISION_WORK_DIR: /tmp/dtp-vision
    tmpfs:
      - /tmp/dtp-vision:size=2g

volumes:
  dtp_staging_pg_data:
