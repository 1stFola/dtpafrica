name: dtp-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dtp_africa}
    volumes:
      - dtp_staging_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtp} -d ${POSTGRES_DB:-dtp_africa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    # Built and pushed by CI, never built here. The staging box is a t3.small:
    # compiling on it burned its CPU credits and left it unable to answer SSH or
    # HTTP for hours. IMAGE_TAG is the commit SHA, so a deploy is reproducible and
    # a rollback is a tag change.
    image: ${IMAGE_REGISTRY}/dtp-api:${IMAGE_TAG}
    # `build` stays for deploy.sh, the manual path, which builds on the box it runs
    # on. CI's deploy never reaches it: Ansible pulls this exact tag first and fails
    # if the pull does not succeed, so `up` always finds the image already present.
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dtp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dtp_africa}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      OCR_SPACE_ENGINE: ${OCR_SPACE_ENGINE:-3}
      # Vision Engine. Every one empty until the dtp/staging/app secret carries it, and
      # VISION_ENABLED unset keeps the module off (docs/vision/15): a deploy without the
      # secret changes nothing.
      VISION_ENABLED: ${VISION_ENABLED:-}
      VISION_STORAGE_BACKEND: ${VISION_STORAGE_BACKEND:-}
      VISION_COMPUTE_PROVIDER: ${VISION_COMPUTE_PROVIDER:-}
      VISION_R2_ACCOUNT_ID: ${VISION_R2_ACCOUNT_ID:-}
      VISION_R2_ACCESS_KEY_ID: ${VISION_R2_ACCESS_KEY_ID:-}
      VISION_R2_SECRET_ACCESS_KEY: ${VISION_R2_SECRET_ACCESS_KEY:-}
      VISION_R2_BUCKET_MASTER: ${VISION_R2_BUCKET_MASTER:-}
      VISION_R2_BUCKET_DERIVED: ${VISION_R2_BUCKET_DERIVED:-}
      VISION_R2_BUCKET_MODELS: ${VISION_R2_BUCKET_MODELS:-}
      VISION_R2_BUCKET_CLIPS: ${VISION_R2_BUCKET_CLIPS:-}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  web:
    image: ${IMAGE_REGISTRY}/dtp-web:${IMAGE_TAG}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  dtp_staging_pg_data:
