[defaults]
inventory          = inventory.ini
remote_user        = ubuntu
private_key_file   = ~/.ssh/dtp-staging.pem
host_key_checking  = false          # set to true after first connection
stdout_callback    = yaml
callbacks_enabled  = timer, profile_tasks

[ssh_connection]
pipelining         = true           # speeds up playbook runs significantly
ssh_args           = -o ControlMaster=auto -o ControlPersist=60s
