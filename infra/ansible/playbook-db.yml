---
# Playbook: provision the PostgreSQL instance
# Run: ansible-playbook -i inventory.ini playbook-db.yml

- name: Provision DB instance
  hosts: db
  become: true

  vars:
    aws_region: "us-east-1"                        # override via -e or group_vars
    vpc_cidr: "10.0.0.0/16"                        # must match Terraform variable
    secrets_manager_db_secret_name: "dtp/staging/db"  # name of the secret in AWS

  roles:
    - common
    - docker
    - db
