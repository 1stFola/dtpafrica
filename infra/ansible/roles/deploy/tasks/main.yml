---
# deploy role — runs on the single DTP server

# ── 1. Set credentials from vars passed in by the CD workflow ─────────────────
# Secrets are fetched on the GitHub Actions runner (where AWS CLI is available)
# and passed as extra vars. The EC2 instance never needs AWS credentials.

- name: Set credential facts
  ansible.builtin.set_fact:
    db_creds:
      POSTGRES_USER:     "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB:       "{{ postgres_db }}"
    app_creds:
      ADMIN_API_KEY: "{{ admin_api_key }}"
      VISION_ENABLED: "{{ vision_enabled | default('') }}"
      VISION_STORAGE_BACKEND: "{{ vision_storage_backend | default('') }}"
      VISION_COMPUTE_PROVIDER: "{{ vision_compute_provider | default('') }}"
      VISION_R2_ACCOUNT_ID: "{{ vision_r2_account_id | default('') }}"
      VISION_R2_ACCESS_KEY_ID: "{{ vision_r2_access_key_id | default('') }}"
      VISION_R2_SECRET_ACCESS_KEY: "{{ vision_r2_secret_access_key | default('') }}"
      VISION_R2_BUCKET_MASTER: "{{ vision_r2_bucket_master | default('') }}"
      VISION_R2_BUCKET_DERIVED: "{{ vision_r2_bucket_derived | default('') }}"
      VISION_R2_BUCKET_MODELS: "{{ vision_r2_bucket_models | default('') }}"
      VISION_R2_BUCKET_CLIPS: "{{ vision_r2_bucket_clips | default('') }}"
  no_log: true

# Read the way the API reads it (vision.config.ts boolFromEnv): 1, true or yes, any
# case. The template compared against 'true' exactly, so a secret holding `True` or
# `1` turned the API on and left the worker's profile off.
- name: Decide whether Vision is on
  ansible.builtin.set_fact:
    vision_on: "{{ (vision_enabled | default('') | string | trim | lower) in ['1', 'true', 'yes'] }}"

# ── 2. Install Node.js (via NodeSource) ───────────────────────────────────────

- name: Check current Node.js version
  ansible.builtin.command: node --version
  register: node_check
  failed_when: false
  changed_when: false

- name: Install Node.js {{ node_version }} LTS via NodeSource
  when: node_check.rc != 0 or not node_check.stdout.startswith('v' + node_version)
  block:
    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Run NodeSource setup script
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      changed_when: true

    - name: Install nodejs package
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Clean up setup script
      ansible.builtin.file:
        path: /tmp/nodesource_setup.sh
        state: absent

- name: Confirm Node.js version
  ansible.builtin.command: node --version
  register: node_version_out
  changed_when: false

- name: Log Node.js version
  ansible.builtin.debug:
    msg: "Node.js installed: {{ node_version_out.stdout }}"

# ── 3. Install pnpm ───────────────────────────────────────────────────────────

- name: Check current pnpm version
  ansible.builtin.command: pnpm --version
  register: pnpm_check
  failed_when: false
  changed_when: false

- name: Install pnpm {{ pnpm_version }} globally via npm
  ansible.builtin.command: npm install -g pnpm@{{ pnpm_version }}
  when: pnpm_check.rc != 0 or pnpm_check.stdout != pnpm_version
  changed_when: true

- name: Confirm pnpm version
  ansible.builtin.command: pnpm --version
  register: pnpm_version_out
  changed_when: false

- name: Log pnpm version
  ansible.builtin.debug:
    msg: "pnpm installed: {{ pnpm_version_out.stdout }}"

# ── 4. Create app directory ───────────────────────────────────────────────────

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0750"

# ── 5. Clone / update repository ─────────────────────────────────────────────

- name: Write temporary GitHub token helper for private repo access
  ansible.builtin.copy:
    dest: /tmp/dtp-git-askpass.sh
    owner: ubuntu
    group: ubuntu
    mode: "0700"
    content: |
      #!/bin/sh
      case "$1" in
        *Username*) echo "x-access-token" ;;
        *Password*) echo "{{ git_repo_token }}" ;;
      esac
  when: git_repo_token is defined and (git_repo_token | length) > 0
  become: true
  become_user: root
  no_log: true

- name: Clone or update repository
  ansible.builtin.git:
    # Embed token in HTTPS URL for private repo access: https://token@github.com/...
    repo: >-
      {{ git_repo_url | regex_replace('https://', 'https://x-access-token:' + git_repo_token + '@')
         if (git_repo_token is defined and (git_repo_token | length) > 0 and git_repo_url.startswith('https://'))
         else git_repo_url }}
    dest:    "{{ app_dir }}/repo"
    # The commit CI verified and the images were built from (`git_version`, set by CD;
    # on rollback, the commit of the tag being restored). The branch tip can be newer,
    # and its compose file would then run against images it was not written for.
    version: "{{ git_version | default(git_branch) }}"
    force:   true
  become: true
  become_user: ubuntu
  environment:
    GIT_TERMINAL_PROMPT: "0"
  no_log: true  # hide URL since it contains the token

- name: Remove temporary GitHub token helper
  ansible.builtin.file:
    path: /tmp/dtp-git-askpass.sh
    state: absent
  when: git_repo_token is defined and (git_repo_token | length) > 0
  become: true
  become_user: root

# ── 6. Write environment files ────────────────────────────────────────────────

- name: Write services/api/.env  (Prisma + API runtime)
  ansible.builtin.template:
    src:   api.env.j2
    dest:  "{{ app_dir }}/repo/services/api/.env"
    owner: ubuntu
    group: ubuntu
    mode:  "0600"
  no_log: true

- name: Write infra/.env.staging  (Docker Compose variables)
  ansible.builtin.template:
    src:   staging.env.j2
    dest:  "{{ app_dir }}/repo/infra/.env.staging"
    owner: ubuntu
    group: ubuntu
    mode:  "0600"
  no_log: true

# ── 7. Take back the space the old build-on-the-box deploy needed ────────────
#
# This used to run `pnpm install --frozen-lockfile` and `prisma:generate` here.
# Both were necessary when the box built its own images. Since CI builds them and
# the box only pulls, nothing after this point touches Node: every remaining task
# is docker, compose, ufw or an HTTP check, and the API runs from the image, which
# carries its own dependencies and its own generated client.
#
# So they were installing roughly 1.5 GB of libraries, on a 20 GB volume, for
# nothing -- and that volume filling is not merely a failed deploy. Postgres on a
# full disk stops accepting writes, which takes the site down for a reason that
# looks nothing like its cause.
#
# The clean-up below is not one-off: `deploy.sh`, the manual fallback path, still
# installs its own dependencies here because it does build on the box. If anyone
# uses it, this puts the space back on the next deploy.
#
# One consequence worth knowing: `pnpm --filter @dtp/api <script>` no longer works
# from {{ app_dir }}/repo, because there are no node_modules there to run it with.
# Run maintenance scripts inside the API container instead, which also gives them
# the right DATABASE_URL -- see infra/DEPLOYMENT.md, "Run a maintenance script".
- name: Remove node_modules the deploy no longer needs
  ansible.builtin.shell: |
    find "{{ app_dir }}/repo" -maxdepth 4 -type d -name node_modules -prune -exec rm -rf {} +
    pnpm store prune >/dev/null 2>&1 || true
  become: true
  become_user: ubuntu
  changed_when: true
  failed_when: false
  environment:
    HOME: /home/ubuntu

# ── 8. Start Postgres first ───────────────────────────────────────────────────

- name: Start Postgres container
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      up -d postgres
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

- name: Wait for Postgres healthcheck to pass (up to 60s)
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      exec -T postgres \
      pg_isready -U {{ db_creds.POSTGRES_USER }} -d {{ db_creds.POSTGRES_DB }}
  args:
    chdir: "{{ app_dir }}/repo"
  register: pg_health
  until: pg_health.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  become: true
  become_user: root

# ── 9. Pull the images CI built, and start the stack ────────────────────────
#
# Nothing is compiled on this box. It is a t3.small — two burstable vCPUs and 2GB
# of RAM shared with Postgres — and building both images here burned its CPU
# credits, after which it accepted TCP connections but was too throttled to answer
# them. SSH and HTTP both timed out for hours. CI builds the same images in about
# three minutes on a 4-vCPU runner, so that is where they are built.

- name: Log in to the image registry
  ansible.builtin.shell:
    cmd: docker login --username AWS --password-stdin {{ image_registry }}
    stdin: "{{ registry_password }}"
  become: true
  become_user: root
  changed_when: true
  no_log: true

# Reclaim space BEFORE pulling. There is a prune at the end of this role as well,
# but a prune that runs after the pull cannot help the pull: the disk fills while
# containerd is extracting a layer, the playbook dies there, and the cleanup step is
# never reached. That is exactly how this box filled up — a deploy failed with
# `no space left on device` mid-extract, and every retry failed the same way.
#
# `docker image prune -a` never removes an image a container is using -- but that
# includes *stopped* containers, and a deploy that died part-way leaves those
# behind still pinning their image. So stopped containers go first, or the image
# prune quietly reclaims nothing on exactly the box that needs it most. Running
# containers are untouched by both, so the release serving traffic survives.
#
# NOTE: images and build cache only. Never `docker system prune --volumes`, which
# would take the Postgres volume with it.
- name: Reclaim disk before pulling (images and build cache, never volumes)
  ansible.builtin.shell: |
    docker container prune -f
    docker image prune -af
    docker builder prune -af
  become: true
  become_user: root
  changed_when: true
  failed_when: false

- name: Measure free space on the root volume
  ansible.builtin.shell: df --output=avail -BM / | tail -1 | tr -dc '0-9'
  register: free_mb
  changed_when: false

- name: Report free space
  ansible.builtin.debug:
    msg: "{{ (free_mb.stdout | int / 1024) | round(1) }} GB free on / before pulling"

# Fail here, with a sentence saying what is wrong, rather than eight minutes later
# inside a layer extraction whose error names a containerd snapshot path.
- name: Refuse to pull without room for the images
  ansible.builtin.assert:
    that: free_mb.stdout | int > 4096
    fail_msg: >-
      Only {{ (free_mb.stdout | int / 1024) | round(1) }} GB free on / after pruning,
      and the API and web images need roughly 4 GB extracted. Pulling would fail
      part-way and leave the stack on the previous release. Free space on the box
      (`docker system df` shows what is using it) and re-run.
    success_msg: "{{ (free_mb.stdout | int / 1024) | round(1) }} GB free — enough for the pull"

- name: Pull the images for this commit
  ansible.builtin.shell: |
    timeout 600 docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      pull --quiet
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

# ── Migrations: once per deploy, forward only, never on rollback ────────────
#
# The API image used to run `prisma db push --accept-data-loss` on every start, the
# rollback included, so restoring an older image dropped every table and column the
# newer one had added, with their data (docs/vision/50, C4). Now the new image applies
# its committed migrations here, before anything is swapped, and a failure stops the
# deploy with the old release still serving. The rollback passes run_migrations=false:
# it restores the application and never the schema.
#
# Live was baselined on 3 October 2026 (all migrations recorded), so `migrate deploy`
# applies only what is new. A migration added from now on reaches live this way and
# no other; no more `migrate resolve --applied` by hand after a deploy.
#
# `docker run` and the Prisma binary itself, not `docker compose run … pnpm`. The first
# deploy under this step ran it through compose and pnpm: the migration applied and
# Prisma said so, then the process never exited, `timeout 600` killed it, and the
# deploy rolled back (docs/vision/52, "The first deploy"). It did not reproduce
# locally, so everything between the step and Prisma is gone instead: no compose CLI,
# no pnpm wrapper or its update check, Prisma's telemetry ping off, stdin closed, and a
# hard kill. The database URL reaches the container through this task's environment
# (`-e DATABASE_URL` with no value), so it is never on a command line or in the log.
# The network is the compose project's default, `name: dtp-staging` in the compose file.
- name: Remove any migrate container a killed deploy left behind
  ansible.builtin.shell: |
    docker ps -aq --filter "name=dtp-staging-api-run-" | xargs -r docker rm -f
    docker ps -aq --filter "name=dtp-staging-migrate" | xargs -r docker rm -f
  become: true
  become_user: root
  changed_when: false
  failed_when: false
  when: run_migrations | default(true) | bool

# A restore point from moments before the schema changes: `dtp-backup run --pre-deploy`
# (roles/backup installs it). It goes to pre-deploy/ in the bucket and
# /var/backups/dtp-db/pre-deploy-*.dump, with their own retention, and sends no
# heartbeat, so the nightly rotation and its alert are untouched. The rollback
# (run_migrations=false) changes no schema and skips it. Restoring from it:
# docs/support-playbook/database-backup-and-restore.md, "A deploy's migration went wrong".
#
# A failed dump fails the deploy. This step is here because `migrate deploy` is the
# likeliest way to lose data, and a migration run without a restore point leaves only
# last night's dump, losing up to a day of results. Failing here costs nothing that
# matters: nothing has been swapped, the old release keeps serving, exactly as when a
# migration fails. And what makes the dump fail (Postgres not answering, a full disk,
# Docker broken) would fail or endanger the migration too. Only the dump must succeed:
# a failed upload is reported and the deploy goes on, because the local copy is the
# quick way back and the nightly heartbeat already reports a broken bucket. On a new
# box with no tables there is nothing to keep, and the step says so and passes. To
# deploy past a broken dump on purpose: -e pre_deploy_backup=false.
- name: Take a restore point before migrating
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/bin/dtp-backup
      - run
      - --pre-deploy
      - --release
      - "{{ image_tag }}"
  register: pre_deploy_backup_result
  timeout: 900
  become: true
  become_user: root
  changed_when: "'nothing to protect' not in pre_deploy_backup_result.stdout"
  when:
    - run_migrations | default(true) | bool
    - pre_deploy_backup | default(true) | bool

- name: Report the restore point
  ansible.builtin.debug:
    msg: "{{ pre_deploy_backup_result.stdout }}"
  when: pre_deploy_backup_result is not skipped

- name: Apply database migrations (forward only)
  ansible.builtin.shell: |
    timeout --kill-after=15 300 docker run --rm --name dtp-staging-migrate \
      --network dtp-staging_default \
      -e DATABASE_URL -e CHECKPOINT_DISABLE=1 -e PRISMA_HIDE_UPDATE_MESSAGE=1 \
      -w /app/services/api --entrypoint ./node_modules/.bin/prisma \
      "{{ image_registry }}/dtp-api:{{ image_tag }}" migrate deploy < /dev/null
  environment:
    # The same URL compose builds for the api service.
    DATABASE_URL: "postgresql://{{ db_creds.POSTGRES_USER }}:{{ db_creds.POSTGRES_PASSWORD }}@postgres:5432/{{ db_creds.POSTGRES_DB }}"
  become: true
  become_user: root
  changed_when: true
  when: run_migrations | default(true) | bool

- name: Start the stack
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

# `up -d --remove-orphans` with the profile inactive does not touch a worker that is
# already running, so turning Vision off used to leave it polling an API that refuses it.
- name: Stop the worker when Vision is off
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      --profile vision \
      stop worker
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true
  failed_when: false
  when: not (vision_on | bool)

# Pulling a new tag every deploy leaves the previous one behind, and this box only
# has a 20GB root volume. Images still referenced by a running container are never
# removed by this, so the release that just started is safe.
#
# The `until=48h` filter this used to carry is gone. It sounded cautious and was the
# reason the disk filled: the image it most needed to remove — the release this deploy
# just replaced — was by definition pulled recently, so the filter always spared it,
# and two images a deploy accumulated until a pull ran out of room. Rollback is
# unaffected in any way that matters: the tags are still in ECR, and rolling back is
# a tag change that pulls again.
- name: Drop images no longer used by any container
  ansible.builtin.shell: docker image prune -af
  become: true
  become_user: root
  changed_when: true
  failed_when: false
# ── 10. UFW — open HTTP and HTTPS ────────────────────────────────────────────

- name: Allow HTTP
  community.general.ufw:
    rule:  allow
    port:  "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule:  allow
    port:  "443"
    proto: tcp

# ── 11. Smoke test ────────────────────────────────────────────────────────────

- name: Show container status before health check
  ansible.builtin.shell: |
    cd {{ app_dir }}/repo
    echo "=== Container status ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml ps
    echo ""
    echo "=== API logs (last 50 lines) ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=50 api
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false

- name: Wait for web (nginx) to be up on port 80 (up to 120s)
  ansible.builtin.wait_for:
    port:    80
    host:    "{{ ansible_host }}"
    timeout: 120

- name: Show container status and API logs
  ansible.builtin.shell: |
    echo "=== CONTAINER STATUS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml ps -a
    echo ""
    echo "=== API LOGS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=80 api
    echo ""
    echo "=== WEB LOGS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=20 web
    echo ""
    # Names only. A deny-list of PASSWORD= and API_KEY= printed both R2 keys in full,
    # and a manual run has no runner to mask them (docs/vision/50).
    echo "=== .env.staging (names; values never printed) ==="
    awk -F= '/^[A-Z][A-Z0-9_]*=/ { v = substr($0, index($0, "=") + 1); print $1 "=" (length(v) ? "(set)" : "(empty)") }' infra/.env.staging
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false
  register: container_logs

- name: Print container logs
  ansible.builtin.debug:
    msg: "{{ container_logs.stdout_lines }}"

- name: Wait for API health check to return 200 (up to 400s)
  ansible.builtin.uri:
    url:            "http://{{ ansible_host }}/api/v1/health"
    status_code:    200
    return_content: false
  register: health
  until:    health.status == 200
  retries:  40
  delay:    10
  ignore_errors: true

- name: Show final container logs if health check failed
  ansible.builtin.shell: |
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=100 api
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false
  when: health.status is not defined or health.status != 200
  register: final_logs

- name: Print final logs
  ansible.builtin.debug:
    msg: "{{ final_logs.stdout_lines }}"
  when: final_logs is not skipped

- name: Fail if health check did not pass
  ansible.builtin.fail:
    msg: "API health check failed after 400s — check logs above for the root cause"
  when: health.status is not defined or health.status != 200

# The API answering is not the whole stack when Vision is on. A worker that cannot
# provision (wrong key, unknown provider) exits 2 and `restart: unless-stopped` loops
# it for ever behind a green deploy. It logs `provisioned worker` once it holds a
# token; until it does, the deploy is not done.
- name: Wait for the Vision worker to provision (up to 180s)
  ansible.builtin.shell: |
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml \
      ps --status running --services | grep -qx worker \
    && docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml \
      logs --no-log-prefix worker 2>&1 | grep -q "provisioned worker"
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  register: worker_up
  until: worker_up.rc == 0
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false
  when: vision_on | bool

- name: Show the worker's logs if it did not provision
  ansible.builtin.shell: |
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml \
      logs --tail=60 worker
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  register: worker_logs
  changed_when: false
  failed_when: false
  when: (vision_on | bool) and worker_up.rc != 0

- name: Fail if the Vision worker did not provision
  ansible.builtin.fail:
    msg: >-
      Vision is on but the worker never provisioned a token within 180s (crash loop,
      wrong VISION_PROVISION_KEY, or the API refusing it). Last worker logs:
      {{ worker_logs.stdout_lines | default([]) | join(' | ') }}
  when: (vision_on | bool) and worker_up.rc != 0

- name: Deployment smoke test passed
  ansible.builtin.debug:
    msg: "Application is live — health check returned HTTP 200"
