---
# deploy role — runs on the single DTP server

# ── 1. Set credentials from vars passed in by the CD workflow ─────────────────
# Secrets are fetched on the GitHub Actions runner (where AWS CLI is available)
# and passed as extra vars. The EC2 instance never needs AWS credentials.

- name: Set credential facts
  ansible.builtin.set_fact:
    db_creds:
      POSTGRES_USER:     "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB:       "{{ postgres_db }}"
    app_creds:
      ADMIN_API_KEY: "{{ admin_api_key }}"
      VISION_ENABLED: "{{ vision_enabled | default('') }}"
      VISION_STORAGE_BACKEND: "{{ vision_storage_backend | default('') }}"
      VISION_COMPUTE_PROVIDER: "{{ vision_compute_provider | default('') }}"
      VISION_R2_ACCOUNT_ID: "{{ vision_r2_account_id | default('') }}"
      VISION_R2_ACCESS_KEY_ID: "{{ vision_r2_access_key_id | default('') }}"
      VISION_R2_SECRET_ACCESS_KEY: "{{ vision_r2_secret_access_key | default('') }}"
      VISION_R2_BUCKET_MASTER: "{{ vision_r2_bucket_master | default('') }}"
      VISION_R2_BUCKET_DERIVED: "{{ vision_r2_bucket_derived | default('') }}"
      VISION_R2_BUCKET_MODELS: "{{ vision_r2_bucket_models | default('') }}"
      VISION_R2_BUCKET_CLIPS: "{{ vision_r2_bucket_clips | default('') }}"
  no_log: true

# ── 2. Install Node.js (via NodeSource) ───────────────────────────────────────

- name: Check current Node.js version
  ansible.builtin.command: node --version
  register: node_check
  failed_when: false
  changed_when: false

- name: Install Node.js {{ node_version }} LTS via NodeSource
  when: node_check.rc != 0 or not node_check.stdout.startswith('v' + node_version)
  block:
    - name: Download NodeSource setup script
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ node_version }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"

    - name: Run NodeSource setup script
      ansible.builtin.command: bash /tmp/nodesource_setup.sh
      changed_when: true

    - name: Install nodejs package
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Clean up setup script
      ansible.builtin.file:
        path: /tmp/nodesource_setup.sh
        state: absent

- name: Confirm Node.js version
  ansible.builtin.command: node --version
  register: node_version_out
  changed_when: false

- name: Log Node.js version
  ansible.builtin.debug:
    msg: "Node.js installed: {{ node_version_out.stdout }}"

# ── 3. Install pnpm ───────────────────────────────────────────────────────────

- name: Check current pnpm version
  ansible.builtin.command: pnpm --version
  register: pnpm_check
  failed_when: false
  changed_when: false

- name: Install pnpm {{ pnpm_version }} globally via npm
  ansible.builtin.command: npm install -g pnpm@{{ pnpm_version }}
  when: pnpm_check.rc != 0 or pnpm_check.stdout != pnpm_version
  changed_when: true

- name: Confirm pnpm version
  ansible.builtin.command: pnpm --version
  register: pnpm_version_out
  changed_when: false

- name: Log pnpm version
  ansible.builtin.debug:
    msg: "pnpm installed: {{ pnpm_version_out.stdout }}"

# ── 4. Create app directory ───────────────────────────────────────────────────

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0750"

# ── 5. Clone / update repository ─────────────────────────────────────────────

- name: Write temporary GitHub token helper for private repo access
  ansible.builtin.copy:
    dest: /tmp/dtp-git-askpass.sh
    owner: ubuntu
    group: ubuntu
    mode: "0700"
    content: |
      #!/bin/sh
      case "$1" in
        *Username*) echo "x-access-token" ;;
        *Password*) echo "{{ git_repo_token }}" ;;
      esac
  when: git_repo_token is defined and (git_repo_token | length) > 0
  become: true
  become_user: root
  no_log: true

- name: Clone or update repository
  ansible.builtin.git:
    # Embed token in HTTPS URL for private repo access: https://token@github.com/...
    repo: >-
      {{ git_repo_url | regex_replace('https://', 'https://x-access-token:' + git_repo_token + '@')
         if (git_repo_token is defined and (git_repo_token | length) > 0 and git_repo_url.startswith('https://'))
         else git_repo_url }}
    dest:    "{{ app_dir }}/repo"
    version: "{{ git_branch }}"
    force:   true
  become: true
  become_user: ubuntu
  environment:
    GIT_TERMINAL_PROMPT: "0"
  no_log: true  # hide URL since it contains the token

- name: Remove temporary GitHub token helper
  ansible.builtin.file:
    path: /tmp/dtp-git-askpass.sh
    state: absent
  when: git_repo_token is defined and (git_repo_token | length) > 0
  become: true
  become_user: root

# ── 6. Write environment files ────────────────────────────────────────────────

- name: Write services/api/.env  (Prisma + API runtime)
  ansible.builtin.template:
    src:   api.env.j2
    dest:  "{{ app_dir }}/repo/services/api/.env"
    owner: ubuntu
    group: ubuntu
    mode:  "0600"
  no_log: true

- name: Write infra/.env.staging  (Docker Compose variables)
  ansible.builtin.template:
    src:   staging.env.j2
    dest:  "{{ app_dir }}/repo/infra/.env.staging"
    owner: ubuntu
    group: ubuntu
    mode:  "0600"
  no_log: true

# ── 7. Take back the space the old build-on-the-box deploy needed ────────────
#
# This used to run `pnpm install --frozen-lockfile` and `prisma:generate` here.
# Both were necessary when the box built its own images. Since CI builds them and
# the box only pulls, nothing after this point touches Node: every remaining task
# is docker, compose, ufw or an HTTP check, and the API runs from the image, which
# carries its own dependencies and its own generated client.
#
# So they were installing roughly 1.5 GB of libraries, on a 20 GB volume, for
# nothing -- and that volume filling is not merely a failed deploy. Postgres on a
# full disk stops accepting writes, which takes the site down for a reason that
# looks nothing like its cause.
#
# The clean-up below is not one-off: `deploy.sh`, the manual fallback path, still
# installs its own dependencies here because it does build on the box. If anyone
# uses it, this puts the space back on the next deploy.
#
# One consequence worth knowing: `pnpm --filter @dtp/api <script>` no longer works
# from {{ app_dir }}/repo, because there are no node_modules there to run it with.
# Run maintenance scripts inside the API container instead, which also gives them
# the right DATABASE_URL -- see infra/DEPLOYMENT.md, "Run a maintenance script".
- name: Remove node_modules the deploy no longer needs
  ansible.builtin.shell: |
    find "{{ app_dir }}/repo" -maxdepth 4 -type d -name node_modules -prune -exec rm -rf {} +
    pnpm store prune >/dev/null 2>&1 || true
  become: true
  become_user: ubuntu
  changed_when: true
  failed_when: false
  environment:
    HOME: /home/ubuntu

# ── 8. Start Postgres first ───────────────────────────────────────────────────

- name: Start Postgres container
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      up -d postgres
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

- name: Wait for Postgres healthcheck to pass (up to 60s)
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      exec -T postgres \
      pg_isready -U {{ db_creds.POSTGRES_USER }} -d {{ db_creds.POSTGRES_DB }}
  args:
    chdir: "{{ app_dir }}/repo"
  register: pg_health
  until: pg_health.rc == 0
  retries: 12
  delay: 5
  changed_when: false
  become: true
  become_user: root

# ── 9. Pull the images CI built, and start the stack ────────────────────────
#
# Nothing is compiled on this box. It is a t3.small — two burstable vCPUs and 2GB
# of RAM shared with Postgres — and building both images here burned its CPU
# credits, after which it accepted TCP connections but was too throttled to answer
# them. SSH and HTTP both timed out for hours. CI builds the same images in about
# three minutes on a 4-vCPU runner, so that is where they are built.

- name: Log in to the image registry
  ansible.builtin.shell:
    cmd: docker login --username AWS --password-stdin {{ image_registry }}
    stdin: "{{ registry_password }}"
  become: true
  become_user: root
  changed_when: true
  no_log: true

# Reclaim space BEFORE pulling. There is a prune at the end of this role as well,
# but a prune that runs after the pull cannot help the pull: the disk fills while
# containerd is extracting a layer, the playbook dies there, and the cleanup step is
# never reached. That is exactly how this box filled up — a deploy failed with
# `no space left on device` mid-extract, and every retry failed the same way.
#
# `docker image prune -a` never removes an image a container is using -- but that
# includes *stopped* containers, and a deploy that died part-way leaves those
# behind still pinning their image. So stopped containers go first, or the image
# prune quietly reclaims nothing on exactly the box that needs it most. Running
# containers are untouched by both, so the release serving traffic survives.
#
# NOTE: images and build cache only. Never `docker system prune --volumes`, which
# would take the Postgres volume with it.
- name: Reclaim disk before pulling (images and build cache, never volumes)
  ansible.builtin.shell: |
    docker container prune -f
    docker image prune -af
    docker builder prune -af
  become: true
  become_user: root
  changed_when: true
  failed_when: false

- name: Measure free space on the root volume
  ansible.builtin.shell: df --output=avail -BM / | tail -1 | tr -dc '0-9'
  register: free_mb
  changed_when: false

- name: Report free space
  ansible.builtin.debug:
    msg: "{{ (free_mb.stdout | int / 1024) | round(1) }} GB free on / before pulling"

# Fail here, with a sentence saying what is wrong, rather than eight minutes later
# inside a layer extraction whose error names a containerd snapshot path.
- name: Refuse to pull without room for the images
  ansible.builtin.assert:
    that: free_mb.stdout | int > 4096
    fail_msg: >-
      Only {{ (free_mb.stdout | int / 1024) | round(1) }} GB free on / after pruning,
      and the API and web images need roughly 4 GB extracted. Pulling would fail
      part-way and leave the stack on the previous release. Free space on the box
      (`docker system df` shows what is using it) and re-run.
    success_msg: "{{ (free_mb.stdout | int / 1024) | round(1) }} GB free — enough for the pull"

- name: Pull the images for this commit
  ansible.builtin.shell: |
    timeout 600 docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      pull --quiet
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

- name: Start the stack
  ansible.builtin.shell: |
    docker compose \
      --env-file infra/.env.staging \
      -f infra/docker-compose.staging.yml \
      up -d --remove-orphans
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: true

# Pulling a new tag every deploy leaves the previous one behind, and this box only
# has a 20GB root volume. Images still referenced by a running container are never
# removed by this, so the release that just started is safe.
#
# The `until=48h` filter this used to carry is gone. It sounded cautious and was the
# reason the disk filled: the image it most needed to remove — the release this deploy
# just replaced — was by definition pulled recently, so the filter always spared it,
# and two images a deploy accumulated until a pull ran out of room. Rollback is
# unaffected in any way that matters: the tags are still in ECR, and rolling back is
# a tag change that pulls again.
- name: Drop images no longer used by any container
  ansible.builtin.shell: docker image prune -af
  become: true
  become_user: root
  changed_when: true
  failed_when: false
# ── 10. UFW — open HTTP and HTTPS ────────────────────────────────────────────

- name: Allow HTTP
  community.general.ufw:
    rule:  allow
    port:  "80"
    proto: tcp

- name: Allow HTTPS
  community.general.ufw:
    rule:  allow
    port:  "443"
    proto: tcp

# ── 11. Smoke test ────────────────────────────────────────────────────────────

- name: Show container status before health check
  ansible.builtin.shell: |
    cd {{ app_dir }}/repo
    echo "=== Container status ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml ps
    echo ""
    echo "=== API logs (last 50 lines) ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=50 api
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false

- name: Wait for web (nginx) to be up on port 80 (up to 120s)
  ansible.builtin.wait_for:
    port:    80
    host:    "{{ ansible_host }}"
    timeout: 120

- name: Show container status and API logs
  ansible.builtin.shell: |
    echo "=== CONTAINER STATUS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml ps -a
    echo ""
    echo "=== API LOGS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=80 api
    echo ""
    echo "=== WEB LOGS ==="
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=20 web
    echo ""
    echo "=== .env.staging (masked) ==="
    cat infra/.env.staging | sed 's/PASSWORD=.*/PASSWORD=***/' | sed 's/API_KEY=.*/API_KEY=***/'
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false
  register: container_logs

- name: Print container logs
  ansible.builtin.debug:
    msg: "{{ container_logs.stdout_lines }}"

- name: Wait for API health check to return 200 (up to 400s)
  ansible.builtin.uri:
    url:            "http://{{ ansible_host }}/api/v1/health"
    status_code:    200
    return_content: false
  register: health
  until:    health.status == 200
  retries:  40
  delay:    10
  ignore_errors: true

- name: Show final container logs if health check failed
  ansible.builtin.shell: |
    docker compose --env-file infra/.env.staging -f infra/docker-compose.staging.yml logs --tail=100 api
  args:
    chdir: "{{ app_dir }}/repo"
  become: true
  become_user: root
  changed_when: false
  failed_when: false
  when: health.status is not defined or health.status != 200
  register: final_logs

- name: Print final logs
  ansible.builtin.debug:
    msg: "{{ final_logs.stdout_lines }}"
  when: final_logs is not skipped

- name: Fail if health check did not pass
  ansible.builtin.fail:
    msg: "API health check failed after 400s — check logs above for the root cause"
  when: health.status is not defined or health.status != 200

- name: Deployment smoke test passed
  ansible.builtin.debug:
    msg: "Application is live — health check returned HTTP 200"
