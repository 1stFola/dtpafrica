---
# Playbook: provision the app instance (API + web)
# Run: ansible-playbook -i inventory.ini playbook-app.yml
#
# Prerequisites:
#   - playbook-db.yml must have run successfully first
#   - db_private_ip must be set (automatically provided via inventory.ini [all:vars])

- name: Provision app instance
  hosts: app
  become: true

  vars:
    aws_region: "us-east-1"
    secrets_manager_db_secret_name: "dtp/staging/db"
    secrets_manager_app_secret_name: "dtp/staging/app"
    git_repo_url: "git@github.com:YOUR_ORG/YOUR_REPO.git"  # replace before running
    git_branch: "main"

  roles:
    - common
    - docker
    - app
